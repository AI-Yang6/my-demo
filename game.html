<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星际幸存者 - 俯视角肉鸽射击</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0a12; overflow:hidden; font-family:'Courier New',monospace;
  user-select:none; -webkit-user-select:none;
}
canvas { display:block; cursor:none; }
#ui-layer {
  position:absolute; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:10;
}
#upgrade-screen {
  display:none; position:absolute; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.85); z-index:100;
  flex-direction:column; align-items:center; justify-content:center;
  overflow:hidden;
}
#upgrade-screen.active { display:flex; }
#upgrade-screen::before {
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,255,180,0.04) 0,rgba(0,255,180,0.04) 1px,transparent 1px,transparent 5px);
  mix-blend-mode:screen;
}
#upgrade-title {
  color:#00d4ff; font-size:36px; margin-bottom:30px; position:relative;
  text-shadow:0 0 20px rgba(0,212,255,0.65),0 0 44px rgba(0,212,255,0.25); letter-spacing:4px;
  white-space:nowrap; overflow:hidden; border-right:2px solid rgba(0,212,255,0.8);
  animation:typeIn 0.9s steps(24,end), caretBlink 0.8s step-end infinite;
}
@keyframes typeIn { from { width:0; } to { width:540px; } }
@keyframes caretBlink { 50% { border-color:transparent; } }
#upgrade-cards { display:flex; gap:20px; position:relative; z-index:1; }
.upgrade-card {
  width:220px; height:300px; background:#0d1117;
  border:1px solid #2a6c88; border-radius:6px; padding:18px;
  cursor:pointer; pointer-events:auto; transition:transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  box-shadow:inset 0 0 26px rgba(0,212,255,0.05);
  position:relative; overflow:hidden;
}
.upgrade-card::before {
  content:""; position:absolute; inset:-40%;
  background:radial-gradient(circle,rgba(0,212,255,0.14),transparent 34%);
  transform:translateY(45%); opacity:0; transition:opacity 0.2s; pointer-events:none;
}
.upgrade-card::after {
  content:""; position:absolute; inset:0; pointer-events:none; opacity:0;
  background:linear-gradient(180deg,transparent,rgba(0,212,255,0.08),transparent);
  animation:cardStream 1.5s linear infinite;
}
@keyframes cardStream { from { transform:translateY(-100%); } to { transform:translateY(100%); } }
.upgrade-card:hover {
  border-color:#00d4ff; transform:translateY(-5px);
  box-shadow:0 0 26px rgba(0,212,255,0.38), inset 0 0 34px rgba(0,212,255,0.08);
}
.upgrade-card:hover::before,.upgrade-card:hover::after { opacity:1; }
.upgrade-card.selecting { animation:cardSelect 0.22s ease-out forwards; }
@keyframes cardSelect { 70% { filter:brightness(3); } 100% { filter:brightness(1.2); transform:scale(1.04); } }
.upgrade-icon {
  width:72px; height:72px; display:flex; align-items:center; justify-content:center;
  font-size:42px; border:1px solid rgba(0,212,255,0.28); color:#00d4ff;
  background:rgba(0,212,255,0.04); clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);
  text-shadow:0 0 18px rgba(0,212,255,0.45);
}
.upgrade-name { color:#fff; font-size:15px; font-weight:bold; text-align:center; }
.upgrade-desc { color:#8b96a8; font-size:12px; text-align:center; line-height:1.5; }
.upgrade-rarity {
  font-size:10px; padding:3px 10px; border-radius:3px; letter-spacing:2px;
}
.rarity-common { color:#8ea0b8; border:1px solid #536273; }
.rarity-rare { color:#4499ee; border:1px solid #4499ee; box-shadow:0 0 12px rgba(68,153,238,0.25); }
.rarity-epic { color:#bb55ee; border:1px solid #bb55ee; box-shadow:0 0 12px rgba(187,85,238,0.25); }
.rarity-legendary { color:#ff9a2f; border:1px solid #ff9a2f; box-shadow:0 0 14px rgba(255,154,47,0.32); }

#main-menu {
  display:flex; position:absolute; top:0; left:0; width:100%; height:100%;
  flex-direction:column; align-items:center; justify-content:center;
  z-index:200; background:linear-gradient(180deg,#050510 0%,#0a0d18 50%,#050510 100%);
}
#main-menu.hidden { display:none; }
#menu-title {
  font-size:52px; color:#00d4ff; letter-spacing:6px; margin-bottom:8px;
  text-shadow:0 0 40px rgba(0,212,255,0.5),0 0 80px rgba(0,212,255,0.2);
}
#menu-subtitle { color:#556688; font-size:14px; margin-bottom:50px; letter-spacing:3px; }
.menu-btn {
  width:260px; padding:14px; margin:8px; background:linear-gradient(135deg,#0d1525,#0a0f1a);
  border:1px solid #2a3a5a; border-radius:4px; color:#aabbcc; font-size:18px;
  cursor:pointer; pointer-events:auto; transition:all 0.2s;
  text-align:center; letter-spacing:2px; font-family:inherit;
}
.menu-btn:hover { border-color:#00d4ff; color:#00d4ff; box-shadow:0 4px 20px rgba(0,212,255,0.15); }
#char-select {
  display:flex; gap:16px; margin-bottom:20px;
}
.char-card,.map-card {
  width:160px; padding:16px; background:rgba(10,15,30,0.6);
  border:1px solid #2a3a5a; border-radius:6px; text-align:center;
  cursor:pointer; transition:all 0.2s;
}
.char-card:hover,.char-card.selected,.map-card:hover,.map-card.selected { border-color:#00d4ff; }
.char-card.selected,.map-card.selected { box-shadow:0 0 20px rgba(0,212,255,0.25); background:rgba(15,22,40,0.8); }
.char-icon,.map-icon { font-size:40px; }
.char-name,.map-name { color:#ccddee; font-size:14px; margin:6px 0; }
.char-desc,.map-desc { color:#7788aa; font-size:11px; line-height:1.3; }
#map-select {
  display:flex; gap:16px; margin-bottom:18px;
}
#map-title {
  color:#7f91a8; font-size:12px; letter-spacing:3px; margin-bottom:10px;
}

#game-over-screen {
  display:none; position:absolute; top:0; left:0; width:100%; height:100%;
  background:rgba(3,3,10,0.88); z-index:200;
  flex-direction:column; align-items:center; justify-content:center;
}
#game-over-screen.active { display:flex; }
#go-title { color:#e84040; font-size:42px; margin-bottom:20px; letter-spacing:4px;
  text-shadow:0 0 30px rgba(232,64,64,0.4); }
#go-stats { color:#aab; font-size:16px; line-height:2; margin-bottom:30px; text-align:center; }
#go-builds { color:#889; font-size:13px; line-height:1.8; text-align:center; margin-bottom:20px;
  max-height:200px; overflow-y:auto; width:400px; }

#boss-healthbar {
  display:none; position:absolute; top:80px; left:50%; transform:translateX(-50%);
  width:320px; height:8px; background:rgba(200,30,30,0.25);
  border:1px solid rgba(200,30,30,0.5); border-radius:4px; z-index:50;
}
#boss-healthbar-fill {
  height:100%; background:linear-gradient(90deg,#cc2222,#ff4444); border-radius:3px; transition:width 0.1s;
}
#boss-name { color:#ee5555; font-size:11px; text-align:center; margin-bottom:4px; letter-spacing:3px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui-layer">

    <div id="boss-name">BOSS</div>

</div>
<div id="main-menu">

<script>
// ==================== CONSTANTS ====================
const CANVAS_W = Math.min(window.innerWidth, 1920);
const CANVAS_H = Math.min(window.innerHeight, 1080);
const WORLD_W = 4000;
const WORLD_H = 4000;
const GAME_DURATION = 600; // 10 minutes in seconds
const BOSS_SPAWN_INTERVAL = 55;
const VIEW_Y_SCALE = 0.72;
const VIEW_Y_OFFSET = CANVAS_H * (1 - VIEW_Y_SCALE) * 0.5;

// ==================== CANVAS SETUP ====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_W;
canvas.height = CANVAS_H;
canvas.style.cursor = 'none';

const mechaSpriteSheet = new Image();
mechaSpriteSheet.src = 'assets/mecha-sprites.png';
let mechaSpriteReady = false;
mechaSpriteSheet.onload = () => { mechaSpriteReady = true; };

const alienSpriteSheet = new Image();
alienSpriteSheet.src = 'assets/alien-swarm-sprites.png';
let alienSpriteReady = false;
alienSpriteSheet.onload = () => { alienSpriteReady = true; };

const dragonSpriteSheet = new Image();
dragonSpriteSheet.src = 'assets/dragon-boss-sprites.png';
let dragonSpriteReady = false;
dragonSpriteSheet.onload = () => { dragonSpriteReady = true; };

const obstacleSpriteSheet = new Image();
obstacleSpriteSheet.src = 'assets/wasteland-obstacles.png';
let obstacleSpriteReady = false;
obstacleSpriteSheet.onload = () => { obstacleSpriteReady = true; };

const MAP_DEFS = {
  wasteland: { src: 'assets/map-wasteland-city.png', base: '#0a0a0f' },
  snow: { src: 'assets/map-snowfield.png', base: '#101823' },
  desert: { src: 'assets/map-desert.png', base: '#17120c' }
};
const mapImages = {};
let currentMapType = 'wasteland';
for (const [key, def] of Object.entries(MAP_DEFS)) {
  const img = new Image();
  img.src = def.src;
  mapImages[key] = img;
}

// ==================== SOUND ENGINE (Web Audio API) ====================
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, type, duration, vol=0.1, slide=0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slide) osc.frequency.linearRampToValueAtTime(freq + slide, t + duration);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + duration);
}
const SHOOT_SAMPLE_VOLUME = 0.16;
const shootSamplePool = Array.from({ length: 8 }, () => {
  const audio = new Audio('assets/shoot-hit.wav');
  audio.volume = SHOOT_SAMPLE_VOLUME;
  audio.preload = 'auto';
  return audio;
});
let shootSampleIndex = 0;
let lastShootSampleAt = 0;
function sfxShoot() {
  const now = performance.now();
  if (now - lastShootSampleAt < 28) return;
  lastShootSampleAt = now;
  const shot = shootSamplePool[shootSampleIndex];
  shootSampleIndex = (shootSampleIndex + 1) % shootSamplePool.length;
  if (shot && shot.readyState > 0) {
    shot.currentTime = 0;
    shot.volume = SHOOT_SAMPLE_VOLUME;
    shot.play().catch(()=>playSound(800,'square',0.08,0.035,-400));
  } else {
    playSound(800,'square',0.08,0.035,-400);
  }
}
function sfxHit() { playSound(200,'sawtooth',0.1,0.04); }
function sfxKill() { playSound(600,'square',0.12,0.06,200); }
function sfxEliteKill() { playSound(150,'triangle',0.2,0.2,300); }
function sfxLevelUp() {
  playSound(523,'square',0.15,0.1); setTimeout(()=>playSound(659,'square',0.15,0.1),100);
  setTimeout(()=>playSound(784,'square',0.2,0.2),200);
}
function sfxBossSpawn() { playSound(80,'sawtooth',0.3,0.5,40); }
function sfxPickup() { playSound(1000,'sine',0.08,0.06,300); }
function sfxExplosion() { playSound(60,'sawtooth',0.2,0.3,-30); }

const bgm = new Audio('assets/bgm.wav');
bgm.loop = true;
bgm.volume = 0.18;
function startBgm() {
  bgm.currentTime = 0;
  bgm.play().catch(()=>{});
}
function stopBgm() {
  bgm.pause();
  bgm.currentTime = 0;
}

// ==================== INPUT ====================
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; e.preventDefault(); });
let mouseX = CANVAS_W/2, mouseY = CANVAS_H/2;
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

// ==================== MATH HELPERS ====================
function dist(a,b) { return Math.hypot(a.x-b.x, a.y-b.y); }
function angle(a,b) { return Math.atan2(b.y-a.y, b.x-a.x); }
function randRange(min,max) { return min+Math.random()*(max-min); }
function randInt(min,max) { return Math.floor(randRange(min,max+1)); }
function clamp(v,lo,hi) { return Math.max(lo,Math.min(hi,v)); }
function lerp(a,b,t) { return a+(b-a)*t; }
function randSign() { return Math.random()<0.5?-1:1; }
function drawRegularPolygon(ctx, x, y, radius, sides, rotation=0) {
  ctx.beginPath();
  for (let i=0; i<sides; i++) {
    const a = rotation + i * Math.PI * 2 / sides;
    const px = x + Math.cos(a) * radius;
    const py = y + Math.sin(a) * radius;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function drawGroundShadow(x, y, w, h, alpha=0.32) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#000';
  ctx.filter = 'blur(3px)';
  ctx.beginPath();
  ctx.ellipse(x, y + h * 0.22, w * 0.36, h * 0.13, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function worldToScreen(x, y, cam=camera) {
  return {
    x: x - cam.x,
    y: (y - cam.y) * VIEW_Y_SCALE + VIEW_Y_OFFSET
  };
}

// ==================== CAMERA ====================
const camera = { x:0, y:0, targetX:0, targetY:0, shakeAmount:0, shakeDuration:0 };
function updateCamera(playerX, playerY, dt) {
  camera.targetX = playerX - CANVAS_W/2;
  camera.targetY = playerY - (CANVAS_H/2 - VIEW_Y_OFFSET) / VIEW_Y_SCALE;
  camera.targetX = clamp(camera.targetX, 0, WORLD_W - CANVAS_W);
  camera.targetY = clamp(camera.targetY, 0, WORLD_H - CANVAS_H / VIEW_Y_SCALE);
  camera.x = lerp(camera.x, camera.targetX, 8*dt);
  camera.y = lerp(camera.y, camera.targetY, 8*dt);
  if (camera.shakeDuration > 0) {
    camera.shakeDuration -= dt;
    camera.x += (Math.random()-0.5)*camera.shakeAmount;
    camera.y += (Math.random()-0.5)*camera.shakeAmount;
  }
}
function shakeCamera(amount, duration) {
  camera.shakeAmount = amount;
  camera.shakeDuration = duration;
}

function resetCameraToPlayer() {
  camera.targetX = clamp(player.x - CANVAS_W/2, 0, WORLD_W - CANVAS_W);
  camera.targetY = clamp(player.y - (CANVAS_H/2 - VIEW_Y_OFFSET) / VIEW_Y_SCALE, 0, WORLD_H - CANVAS_H / VIEW_Y_SCALE);
  camera.x = camera.targetX;
  camera.y = camera.targetY;
  camera.shakeAmount = 0;
  camera.shakeDuration = 0;
}

// ==================== OBJECT POOLS ====================
class Pool {
  constructor(createFn) { this.items=[]; this.createFn=createFn; }
  get() {
    for (let i=0; i<this.items.length; i++) {
      if (!this.items[i].alive) { this.items[i].reset(); return this.items[i]; }
    }
    const item = this.createFn();
    this.items.push(item);
    return item;
  }
  getAlive() { return this.items.filter(i=>i.alive); }
  countAlive() { let c=0; for(let i of this.items) if(i.alive)c++; return c; }
}

// ==================== SPATIAL GRID (for 200+ enemy performance) ====================
class SpatialGrid {
  constructor(cellSize) {
    this.cellSize = cellSize;
    this.cells = {};
  }
  clear() { this.cells = {}; }
  key(x, y) {
    const cx = Math.floor(x / this.cellSize);
    const cy = Math.floor(y / this.cellSize);
    return cx + ',' + cy;
  }
  insert(obj) {
    const k = this.key(obj.x, obj.y);
    if (!this.cells[k]) this.cells[k] = [];
    this.cells[k].push(obj);
  }
  query(x, y, radius) {
    const results = [];
    const minCX = Math.floor((x - radius) / this.cellSize);
    const maxCX = Math.floor((x + radius) / this.cellSize);
    const minCY = Math.floor((y - radius) / this.cellSize);
    const maxCY = Math.floor((y + radius) / this.cellSize);
    for (let cx = minCX; cx <= maxCX; cx++) {
      for (let cy = minCY; cy <= maxCY; cy++) {
        const cell = this.cells[cx + ',' + cy];
        if (cell) {
          for (const obj of cell) results.push(obj);
        }
      }
    }
    return results;
  }
}
const enemyGrid = new SpatialGrid(150);

// ==================== PARTICLES ====================
class Particle {
  constructor() { this.reset(); }
  reset() {
    this.alive=true; this.x=0; this.y=0; this.vx=0; this.vy=0; this.life=0; this.maxLife=0;
    this.color='#fff'; this.size=3; this.type='spark'; this.rotation=Math.random()*Math.PI*2;
  }
  init(x,y,vx,vy,life,color,size=3,type='spark') {
    this.alive=true; this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.life=this.maxLife=life; this.color=color; this.size=size; this.type=type;
    this.rotation=Math.random()*Math.PI*2;
    return this;
  }
  update(dt) {
    this.life-=dt; if(this.life<=0){this.alive=false;return;}
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    if (this.type === 'smoke') {
      this.y -= 14 * dt;
      this.size *= 1 + dt * 0.65;
    }
    this.vx*=0.95; this.vy*=0.95;
  }
  draw(ctx, cam) {
    const alpha = this.life/this.maxLife;
    const p = worldToScreen(this.x, this.y, cam);
    const sx = p.x, sy = p.y;
    if(sx<-20||sx>CANVAS_W+20||sy<-20||sy>CANVAS_H+20) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (this.type === 'shockwave') {
      const r = this.size * (1 - alpha);
      ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.stroke();
    } else if (this.type === 'smoke') {
      ctx.globalAlpha = alpha * 0.58;
      ctx.filter = 'blur(5px)';
      const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, this.size);
      grad.addColorStop(0, 'rgba(20,16,14,0.78)');
      grad.addColorStop(0.55, 'rgba(12,10,9,0.42)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(sx, sy, this.size, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.shadowColor = this.color; ctx.shadowBlur = this.type === 'ember' ? 10 : 6;
      ctx.fillStyle = this.color;
      if (this.type === 'ember') {
        ctx.beginPath(); ctx.arc(sx, sy, this.size * (0.6 + alpha), 0, Math.PI*2); ctx.fill();
      } else {
        ctx.translate(sx, sy); ctx.rotate(this.rotation);
        ctx.fillRect(-this.size/2, -this.size/2, this.size*alpha, this.size*alpha);
      }
    }
    ctx.restore();
  }
}
const particlePool = new Pool(()=>new Particle());

function spawnExplosion(x, y, count, color, size=3, life=0.3) {
  for (let i=0; i<count; i++) {
    const a = Math.random()*Math.PI*2;
    const s = randRange(50,220);

function updateElementFx(dt) {

function drawJaggedBolt(x1, y1, x2, y2, alpha, width=2) {
  const segments = 8;
  const dx = x2-x1, dy = y2-y1;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  for (let i=1; i<segments; i++) {
    const t = i / segments;
    const jitter = (Math.random()-0.5) * 18 * (1 - Math.abs(t-0.5));
    ctx.lineTo(x1 + dx*t + nx*jitter, y1 + dy*t + ny*jitter);
  }
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = `rgba(210,245,255,${alpha})`;
  ctx.lineWidth = width;
  ctx.shadowColor = '#66e8ff';
  ctx.shadowBlur = 14;
  ctx.stroke();
  ctx.strokeStyle = `rgba(255,255,255,${alpha*0.9})`;
  ctx.lineWidth = Math.max(1, width*0.45);
  ctx.stroke();
}

function drawElementFx() {
  for (const fx of elementFx) {
    const alpha = clamp(fx.life / fx.maxLife, 0, 1);
    const p = worldToScreen(fx.x, fx.y, camera);
    ctx.save();
    if (fx.type === 'fire') {
      ctx.translate(p.x, p.y);
      ctx.scale(1, VIEW_Y_SCALE);
      const r = fx.radius * (1.05 - alpha*0.15);
      const grad = ctx.createRadialGradient(0, 0, r*0.08, 0, 0, r);
      grad.addColorStop(0, `rgba(255,230,120,${0.34*alpha})`);
      grad.addColorStop(0.28, `rgba(255,90,20,${0.28*alpha})`);
      grad.addColorStop(0.68, `rgba(160,24,5,${0.13*alpha})`);
      grad.addColorStop(1, 'rgba(80,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
      for (let i=0; i<9; i++) {
        const a = fx.seed + i*Math.PI*2/9 + (1-alpha)*0.8;
        const flameH = r * randRange(0.35, 0.65);
        ctx.fillStyle = i%2 ? `rgba(255,70,12,${0.22*alpha})` : `rgba(255,185,55,${0.24*alpha})`;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*r*0.18, Math.sin(a)*r*0.18);
        ctx.quadraticCurveTo(Math.cos(a+0.2)*r*0.52, Math.sin(a+0.2)*r*0.52, Math.cos(a)*flameH, Math.sin(a)*flameH);
        ctx.quadraticCurveTo(Math.cos(a-0.25)*r*0.34, Math.sin(a-0.25)*r*0.34, Math.cos(a)*r*0.18, Math.sin(a)*r*0.18);
        ctx.fill();
      }
    } else if (fx.type === 'ice') {
      ctx.translate(p.x, p.y);
      ctx.scale(1, VIEW_Y_SCALE);
      const r = fx.radius * (1.08 - alpha*0.18);
      const grad = ctx.createRadialGradient(0, 0, r*0.05, 0, 0, r);
      grad.addColorStop(0, `rgba(235,255,255,${0.38*alpha})`);
      grad.addColorStop(0.35, `rgba(70,210,255,${0.24*alpha})`);
      grad.addColorStop(0.78, `rgba(20,90,180,${0.14*alpha})`);
      grad.addColorStop(1, 'rgba(0,30,80,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = `rgba(210,250,255,${0.62*alpha})`;
      ctx.lineWidth = 2;
      ctx.shadowColor = '#90f4ff';
      ctx.shadowBlur = 18;
      for (let i=0; i<11; i++) {
        const a = fx.seed + i*Math.PI*2/11;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*r*0.18, Math.sin(a)*r*0.18);
        ctx.lineTo(Math.cos(a)*r*randRange(0.58,0.98), Math.sin(a)*r*randRange(0.58,0.98));
        ctx.stroke();
      }
    } else {
      ctx.translate(p.x, p.y);
      ctx.scale(1, VIEW_Y_SCALE);
      ctx.strokeStyle = `rgba(100,220,255,${0.36*alpha})`;
      ctx.lineWidth = 2;
      ctx.shadowColor = '#00d4ff';
      ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(0, 0, fx.radius*(1-alpha*0.2), 0, Math.PI*2); ctx.stroke();
      ctx.restore();
      ctx.save();
      const targets = [];
      for (let i=0; i<7; i++) {
        const a = fx.seed + i*Math.PI*2/7;
        const end = worldToScreen(fx.x + Math.cos(a)*fx.radius*randRange(0.45,0.95), fx.y + Math.sin(a)*fx.radius*randRange(0.45,0.95), camera);
        targets.push(end);
      }
      for (const t of targets) drawJaggedBolt(p.x, p.y, t.x, t.y, alpha, 2.5);
    }
    ctx.restore();
  }
}

function applyElementArea(bullet, sourceEnemy, dmg) {
  if (!bullet || (bullet.element !== 'fire' && bullet.element !== 'lightning' && bullet.element !== 'ice')) return;
  const radius = bullet.element === 'fire' ? 135 : (bullet.element === 'ice' ? 125 : 165);
  const multiplier = bullet.element === 'fire' ? 0.48 : (bullet.element === 'ice' ? 0.38 : 0.68);
  if (bullet.element === 'fire') spawnFlameBurst(sourceEnemy.x, sourceEnemy.y, radius);
  else if (bullet.element === 'ice') spawnIceBurst(sourceEnemy.x, sourceEnemy.y, radius);
  else spawnLightningStorm(sourceEnemy.x, sourceEnemy.y, radius);

  const targets = enemyGrid.query(sourceEnemy.x, sourceEnemy.y, radius + 40);
  for (const e of targets) {
    if (!e.alive || e === sourceEnemy || dist(e, sourceEnemy) > radius) continue;
    if (bullet.element === 'fire') {
      e.burnTimer = Math.max(e.burnTimer, 2.5);
      e.burnDmg = Math.max(e.burnDmg, dmg * 0.22);
    } else if (bullet.element === 'ice') {
      e.slowTimer = Math.max(e.slowTimer, 2.2);
      e.slowAmount = Math.max(e.slowAmount, e.isBoss ? 0.35 : 0.72);
    } else {
      e.slowTimer = Math.max(e.slowTimer, 0.35);
      e.slowAmount = Math.max(e.slowAmount, 0.25);
    }
    const killed = e.takeDamage(dmg * multiplier, null, player.x, player.y);
    gameState.totalDamageDealt += dmg * multiplier;
    if (killed) onEnemyKilled(e);
  }
}

class FloatText {

class Bullet {
  constructor() { this.reset(); }
  reset() {
    this.alive=true; this.x=0; this.y=0; this.vx=0; this.vy=0;
    this.damage=10; this.pierce=0; this.bounces=0; this.bounceTargets=[];
    this.aoeRadius=0; this.element='none';
    this.size=3; this.color='#ff0'; this.lifetime=0; this.maxLifetime=2;
    this.fromPlayer=true; this.kind='machinegun';
  }
  init(x,y,angle,speed,damage,color,size=3,pierce=0,bounces=0,aoeRadius=0,element='none') {
    this.alive=true; this.x=x; this.y=y;
    this.vx=Math.cos(angle)*speed; this.vy=Math.sin(angle)*speed;
    this.speed=speed; this.damage=damage; this.color=color; this.size=size;
    this.pierce=pierce; this.bounces=bounces; this.bounceTargets=[];
    this.aoeRadius=aoeRadius; this.element=element;
    this.lifetime=0; this.maxLifetime=3; this.fromPlayer=true;
    this.kind = aoeRadius > 0 || element === 'ice' || element === 'lightning' ? 'energy' : (size >= 3 ? 'shotgun' : 'machinegun');
    return this;
  }
  update(dt) {
    this.lifetime+=dt;
    if(this.lifetime>this.maxLifetime){this.alive=false;return;}
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    // World bounds
    if(this.x<0||this.x>WORLD_W||this.y<0||this.y>WORLD_H) this.alive=false;
    // Slow fire bullets
    if(this.element==='fire') { this.vx*=0.995; this.vy*=0.995; }
  }
  draw(ctx, cam) {
    const p = worldToScreen(this.x, this.y, cam);
    const sx=p.x, sy=p.y;
    if(sx<-20||sx>CANVAS_W+20||sy<-20||sy>CANVAS_H+20)return;
    ctx.save();
    const a = Math.atan2(this.vy, this.vx);
    ctx.translate(sx, sy);
    ctx.rotate(a);
    if (this.kind === 'energy') {
      const r = Math.max(6, this.size * 2.8);
      const grad = ctx.createRadialGradient(0,0,0,0,0,r*2.2);
      grad.addColorStop(0,'rgba(220,255,255,1)');
      grad.addColorStop(0.32,'rgba(0,212,255,0.9)');
      grad.addColorStop(1,'rgba(0,212,255,0)');
      ctx.shadowColor = '#00d4ff'; ctx.shadowBlur = 16;
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0,0,r*1.55,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
    } else if (this.kind === 'shotgun') {
      ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 9;
      ctx.fillStyle = '#ff4400';
      ctx.globalAlpha = 0.32;
      ctx.fillRect(-14, -2, 18, 4);
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(0,0,Math.max(3.5,this.size),0,Math.PI*2); ctx.fill();
    } else {
      ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 5;
      ctx.fillStyle = '#ffaa00';
      ctx.fillRect(-8, -1, 12, 2);
      ctx.fillStyle = '#fff4ba';
      ctx.fillRect(2, -0.6, 5, 1.2);
    }
    ctx.restore();
  }
}
const bulletPool = new Pool(()=>new Bullet());

class BossFireball {
  constructor() { this.reset(); }
  reset() {
    this.alive=true; this.x=0; this.y=0; this.vx=0; this.vy=0;
    this.radius=18; this.damage=24; this.life=0; this.maxLife=4;
  }
  init(x, y, targetX, targetY, speed=260) {
    this.alive=true; this.x=x; this.y=y; this.life=0; this.maxLife=4;
    const a = Math.atan2(targetY-y, targetX-x);
    this.vx = Math.cos(a) * speed; this.vy = Math.sin(a) * speed;
    return this;
  }
  update(dt) {
    this.life += dt;
    if (this.life > this.maxLife) { this.alive = false; return; }
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.vx *= 0.998; this.vy *= 0.998;
    if (Math.random() < 0.75) {
      particlePool.get().init(this.x-randRange(4,12), this.y+randRange(-5,5), -this.vx*0.08, -this.vy*0.08, randRange(0.22,0.42), '#ff7422', randRange(3,6), 'ember');
    }
    if (this.x<0||this.x>WORLD_W||this.y<0||this.y>WORLD_H) this.alive=false;
  }
  draw(ctx, cam) {
    const p = worldToScreen(this.x, this.y, cam);
    if (p.x<-40||p.x>CANVAS_W+40||p.y<-40||p.y>CANVAS_H+40) return;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(1, VIEW_Y_SCALE);
    const grad = ctx.createRadialGradient(0,0,0,0,0,this.radius*2.2);
    grad.addColorStop(0,'rgba(255,245,185,1)');
    grad.addColorStop(0.28,'rgba(255,110,18,0.95)');
    grad.addColorStop(1,'rgba(140,0,0,0)');
    ctx.shadowColor = '#ff4a11'; ctx.shadowBlur = 24;
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0,0,this.radius*1.8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff0a0';
    ctx.beginPath(); ctx.arc(0,0,this.radius*0.52,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
const bossFireballPool = new Pool(()=>new BossFireball());
const bossBreaths = [];

function spawnDragonFireball(boss, targetX, targetY) {
  const a = angle(boss, {x:targetX, y:targetY});
  const mouthX = boss.x + Math.cos(a) * 68;
  const mouthY = boss.y + Math.sin(a) * 68;
  bossFireballPool.get().init(mouthX, mouthY, targetX, targetY, 245);
  for (let i=0; i<10; i++) {
    particlePool.get().init(mouthX, mouthY, Math.cos(a+randRange(-0.8,0.8))*randRange(50,160), Math.sin(a+randRange(-0.8,0.8))*randRange(50,160), randRange(0.25,0.5), '#ff8a22', randRange(3,7), 'ember');
  }
}

function spawnDragonBreath(boss, targetX, targetY) {
  const a = angle(boss, {x:targetX, y:targetY});
  bossBreaths.push({ alive:true, x:boss.x, y:boss.y, angle:a, range:310, width:0.7, damage:17, life:0.7, maxLife:0.7, tick:0 });
  for (let i=0; i<28; i++) {
    const d = randRange(55,300);
    const ba = a + randRange(-0.34,0.34);
    particlePool.get().init(boss.x+Math.cos(ba)*d, boss.y+Math.sin(ba)*d, Math.cos(ba)*randRange(40,160), Math.sin(ba)*randRange(40,160), randRange(0.24,0.5), Math.random()<0.45?'#ffd166':'#ff4a12', randRange(4,9), 'ember');
  }
}

function updateBossAttacks(dt) {
  for (const fireball of bossFireballPool.getAlive()) {
    fireball.update(dt);
    if (!fireball.alive) continue;
    if (dist(fireball, player) < fireball.radius + player.size) {
      fireball.alive = false;
      spawnFlameBurst(fireball.x, fireball.y, 118);
      sfxExplosion();
      if (playerTakeDamage(fireball.damage)) { endGame(false); return; }
    }
  }
  for (let i=bossBreaths.length-1; i>=0; i--) {
    const breath = bossBreaths[i];
    breath.life -= dt;
    breath.tick -= dt;
    if (breath.tick <= 0) {
      breath.tick = 0.16;
      const dx = player.x - breath.x, dy = player.y - breath.y;
      const d = Math.hypot(dx, dy);
      const da = angleDelta(Math.atan2(dy, dx), breath.angle);
      if (d < breath.range && da < breath.width * 0.5) {
        if (playerTakeDamage(breath.damage)) { endGame(false); return; }
      }
    }
    if (breath.life <= 0) bossBreaths.splice(i, 1);
  }
}

function drawBossBreaths() {
  for (const breath of bossBreaths) {
    const alpha = clamp(breath.life / breath.maxLife, 0, 1);
    const origin = worldToScreen(breath.x, breath.y, camera);
    const left = worldToScreen(breath.x + Math.cos(breath.angle-breath.width/2)*breath.range, breath.y + Math.sin(breath.angle-breath.width/2)*breath.range, camera);
    const right = worldToScreen(breath.x + Math.cos(breath.angle+breath.width/2)*breath.range, breath.y + Math.sin(breath.angle+breath.width/2)*breath.range, camera);
    ctx.save();
    const grad = ctx.createRadialGradient(origin.x, origin.y, 0, origin.x, origin.y, breath.range);
    grad.addColorStop(0, `rgba(255,240,145,${0.44*alpha})`);
    grad.addColorStop(0.35, `rgba(255,82,18,${0.28*alpha})`);
    grad.addColorStop(1, 'rgba(50,0,0,0)');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#ff3a10'; ctx.shadowBlur = 22;
    ctx.beginPath();
    ctx.moveTo(origin.x, origin.y);
    ctx.lineTo(left.x, left.y);
    ctx.quadraticCurveTo((left.x+right.x)/2, (left.y+right.y)/2 - 35*alpha, right.x, right.y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

const ALIEN_SPRITE_COLS = 8;
const ALIEN_SPRITE_ROWS = 3;
const ALIEN_ROW_BY_TYPE = { normal: 0, fast: 1, elite: 2, boss: 2 };
const DRAGON_SPRITE_COLS = 8;
const DRAGON_SPRITE_ROWS = 3;

function enemySpriteWidth(enemy) {
  if (enemy.isBoss) return 130;
  if (enemy.type === 'elite') return 82;
  if (enemy.type === 'fast') return 38;
  return 48;
}

function drawAlienSprite(enemy, sx, sy, alpha=1) {
  const frameW = alienSpriteSheet.naturalWidth / ALIEN_SPRITE_COLS;
  const frameH = alienSpriteSheet.naturalHeight / ALIEN_SPRITE_ROWS;
  const row = ALIEN_ROW_BY_TYPE[enemy.type] ?? 0;
  const faceAngle = Math.atan2(enemy.vy || 1, enemy.vx || 0);
  const col = directionFrameFromAngle(faceAngle);
  const drawW = enemySpriteWidth(enemy);
  const drawH = drawW * frameH / frameW;

  drawGroundShadow(sx, sy, drawW, drawH, enemy.type === 'fast' ? 0.18 : 0.26);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = enemy.type === 'fast' ? '#ff3300' : (enemy.type === 'normal' ? '#8b0000' : '#b000ff');
  ctx.shadowBlur = enemy.hitFlash > 0 ? 0 : (enemy.isBoss ? 16 : 8);
  ctx.filter = enemy.hitFlash > 0 ? 'brightness(3.8) grayscale(1)' : 'brightness(0.9) saturate(0.88) contrast(0.96)';
  if (enemy.slowTimer > 0) {
    ctx.shadowColor = '#66ccff';
    ctx.shadowBlur = 16;
  }
  if (enemy.burnTimer > 0) {
    ctx.shadowColor = '#ff6600';
    ctx.shadowBlur = 18;
  }
  ctx.drawImage(
    alienSpriteSheet,
    col * frameW, row * frameH, frameW, frameH,
    sx - drawW / 2, sy - drawH * 0.76, drawW, drawH
  );
  ctx.restore();
}

function drawDragonBossSprite(enemy, sx, sy, alpha=1) {
  const frameW = dragonSpriteSheet.naturalWidth / DRAGON_SPRITE_COLS;
  const frameH = dragonSpriteSheet.naturalHeight / DRAGON_SPRITE_ROWS;
  const faceAngle = Math.atan2(enemy.vy || 1, enemy.vx || 0);
  const col = directionFrameFromAngle(faceAngle);
  const row = enemy.bossPhase === 1 ? 1 : (enemy.bossPhase === 2 ? 2 : 0);
  const drawW = 172;
  const drawH = drawW * frameH / frameW;
  drawGroundShadow(sx, sy, drawW, drawH, 0.36);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = enemy.burnTimer > 0 ? '#ff6a00' : (enemy.slowTimer > 0 ? '#72eaff' : '#ff2515');
  ctx.shadowBlur = enemy.hitFlash > 0 ? 0 : 24;
  ctx.filter = enemy.hitFlash > 0 ? 'brightness(3.5) grayscale(1)' : 'brightness(0.92) saturate(1.08) contrast(1.06)';
  ctx.drawImage(
    dragonSpriteSheet,
    col * frameW, row * frameH, frameW, frameH,
    sx - drawW / 2, sy - drawH * 0.78, drawW, drawH
  );
  ctx.restore();
}

class Enemy {
  constructor() { this.reset(); }
  reset() {
    this.alive=true; this.x=0; this.y=0; this.vx=0; this.vy=0;
    this.hp=0; this.maxHp=0; this.speed=0; this.damage=10; this.size=10;
    this.type='normal'; this.color='#f44'; this.xpValue=10;
    this.burnTimer=0; this.burnDmg=0; this.slowTimer=0; this.slowAmount=0;
    this.hitFlash=0; this.knockbackX=0; this.knockbackY=0;
    this.isBoss=false; this.bossAttackTimer=0; this.bossPhase=0; this.bossCastTimer=0;
    this.trail=[]; this.phase=Math.random()*Math.PI*2;
  }
  init(x,y,type) {
    this.alive=true; this.x=x; this.y=y; this.vx=0; this.vy=0;
    this.burnTimer=0; this.burnDmg=0; this.slowTimer=0; this.slowAmount=0;
    this.hitFlash=0; this.knockbackX=0; this.knockbackY=0;
    this.isBoss=false; this.bossAttackTimer=0; this.bossPhase=0; this.bossCastTimer=0;
    this.trail=[]; this.phase=Math.random()*Math.PI*2;
    switch(type) {
      case 'normal':
        this.hp=this.maxHp=30; this.speed=randRange(60,90); this.size=12;
        this.color='#8b0000'; this.xpValue=10;
        break;
      case 'fast':
        this.hp=this.maxHp=15; this.speed=randRange(140,180); this.size=8;
        this.color='#cc2200'; this.xpValue=8;
        break;
      case 'elite':
        this.hp=this.maxHp=160; this.speed=randRange(40,55); this.size=22;
        this.color='#4a0066'; this.xpValue=50;
        break;
      case 'boss':
        this.hp=this.maxHp=900; this.speed=randRange(22,32); this.size=58;
        this.color='#7a1200'; this.xpValue=260; this.isBoss=true;
        this.bossAttackTimer=1.8; this.bossPhase=0; this.bossCastTimer=0;
        break;
    }
    this.type=type; return this;
  }
  takeDamage(dmg, bullet, playerX, playerY) {
    // Flash
    this.hitFlash = 0.1;
    // Element effects
    if (bullet) {
      if (bullet.element==='fire') { this.burnTimer=2; this.burnDmg=dmg*0.3; }
      if (bullet.element==='ice') { this.slowTimer=1.8; this.slowAmount=this.isBoss?0.35:0.65; }
    }
    // Knockback
    if (bullet) {
      const a = angle({x:bullet.x,y:bullet.y}, {x:this.x,y:this.y});
      const kb = this.isBoss? 30 : 150;
      this.knockbackX += Math.cos(a)*kb;
      this.knockbackY += Math.sin(a)*kb;
    }
    this.hp -= dmg;
    if (this.hp <= 0) {
      this.alive = false;
      return true; // killed
    }
    return false;
  }
  update(dt, playerX, playerY) {
    this.hitFlash = Math.max(0, this.hitFlash-dt*4);
    if (this.type === 'fast') {
      this.trail.unshift({x:this.x, y:this.y});
      if (this.trail.length > 3) this.trail.pop();
    }
    // Burn
    if (this.burnTimer>0) { this.burnTimer-=dt; this.hp-=this.burnDmg*dt; if(this.hp<=0){this.alive=false;return;} }
    // Slow
    if (this.slowTimer>0) this.slowTimer-=dt;
    const spdMult = this.slowTimer>0 ? (1-this.slowAmount) : 1;
    const effectiveSpeed = this.speed * spdMult;

    // Boss AI
    if (this.isBoss) {
      this.bossAttackTimer += dt;
      if (this.bossCastTimer > 0) this.bossCastTimer -= dt;
      if (this.bossAttackTimer > 2.8) {
        this.bossAttackTimer = 0;
        this.bossPhase = (this.bossPhase+1)%3;
        this.bossCastTimer = 0.55;
        if (this.bossPhase === 1) {
          spawnDragonBreath(this, playerX, playerY);
          playSound(95,'sawtooth',0.24,0.22,60);
        } else {
          spawnDragonFireball(this, playerX, playerY);
          setTimeout(()=>{ if (this.alive) spawnDragonFireball(this, player.x, player.y); }, 180);
          playSound(130,'triangle',0.16,0.18,-40);
        }
      }
    }

    // Movement towards player
    const a = angle({x:this.x,y:this.y}, {x:playerX,y:playerY});
    this.vx = Math.cos(a)*effectiveSpeed;
    this.vy = Math.sin(a)*effectiveSpeed;
    this.x+=this.vx*dt + this.knockbackX*dt;
    this.y+=this.vy*dt + this.knockbackY*dt;
    this.knockbackX *= 0.85; this.knockbackY *= 0.85;
  }
  draw(ctx, cam) {
    const p = worldToScreen(this.x, this.y, cam);
    const sx=p.x, sy=p.y;
    if(sx<-50||sx>CANVAS_W+50||sy<-50||sy>CANVAS_H+50)return;
    ctx.save();

    let col = this.color;
    if (this.hitFlash > 0) col = '#ffffff';

    if (this.isBoss && (dragonSpriteReady || dragonSpriteSheet.complete) && dragonSpriteSheet.naturalWidth > 0) {
      const rot = Date.now()/420;
      ctx.shadowColor = '#ff3d14'; ctx.shadowBlur = 22;
      ctx.strokeStyle = 'rgba(255,100,40,0.82)';
      ctx.lineWidth = 3;
      ctx.setLineDash([14,7]);
      ctx.beginPath(); ctx.arc(sx, sy, this.size*1.25, rot, rot + Math.PI*1.55); ctx.stroke();
      ctx.setLineDash([]);
      if (this.bossCastTimer > 0) {
        const a = angle(this, player);
        const mouth = worldToScreen(this.x + Math.cos(a)*68, this.y + Math.sin(a)*68, cam);
        const pulse = this.bossCastTimer / 0.55;
        ctx.fillStyle = `rgba(255,190,60,${0.36*pulse})`;
        ctx.shadowColor = '#ff5a12'; ctx.shadowBlur = 30;
        ctx.beginPath(); ctx.arc(mouth.x, mouth.y, 38*(1-pulse)+12, 0, Math.PI*2); ctx.fill();
      }
      drawDragonBossSprite(this, sx, sy, 1);
      ctx.restore();
      return;
    }

    if ((alienSpriteReady || alienSpriteSheet.complete) && alienSpriteSheet.naturalWidth > 0) {
      if (this.type === 'fast') {
        for (let i=this.trail.length-1; i>=0; i--) {
          const t = this.trail[i];
          const tp = worldToScreen(t.x, t.y, cam);
          drawAlienSprite(this, tp.x, tp.y, 0.1 + (this.trail.length-i)*0.08);
        }
      }
      if (this.isBoss || this.type==='elite') {
        const rot = Date.now()/480;
        ctx.shadowColor = '#b000ff'; ctx.shadowBlur = 16;
        ctx.strokeStyle = this.isBoss ? 'rgba(255,80,255,0.8)' : 'rgba(0,212,255,0.75)';
        ctx.lineWidth = this.isBoss ? 3 : 2;
        ctx.setLineDash([10,6]);
        ctx.beginPath(); ctx.arc(sx, sy, this.size*1.65, rot, rot + Math.PI*1.55); ctx.stroke();
        ctx.setLineDash([]);
      }
      drawAlienSprite(this, sx, sy, 1);
      ctx.restore();
      return;
    }

    // Slow effect
    if (this.slowTimer > 0) {
      ctx.shadowColor = '#66ccff'; ctx.shadowBlur = 8;
    }
    // Burn effect
    if (this.burnTimer > 0) {
      ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 10;
    }

    if (this.type === 'fast') {
      for (let i=this.trail.length-1; i>=0; i--) {
        const t = this.trail[i];
        ctx.globalAlpha = 0.12 + (this.trail.length-i)*0.08;
        ctx.fillStyle = '#cc2200';
        const tp = worldToScreen(t.x, t.y, cam);
        drawRegularPolygon(ctx, tp.x, tp.y, this.size, 7, this.phase);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    const pulse = 1 + Math.sin(Date.now()/220 + this.phase)*0.08;
    if (this.isBoss || this.type==='elite') {
      const rot = Date.now()/480;
      ctx.shadowColor = '#b000ff'; ctx.shadowBlur = 16;
      ctx.strokeStyle = this.isBoss ? 'rgba(255,80,255,0.8)' : 'rgba(0,212,255,0.75)';
      ctx.lineWidth = this.isBoss ? 3 : 2;
      ctx.setLineDash([10,6]);
      ctx.beginPath(); ctx.arc(sx, sy, this.size*1.45, rot, rot + Math.PI*1.55); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.shadowColor = this.type==='elite' || this.isBoss ? '#a000cc' : '#8b0000';
    ctx.shadowBlur = this.hitFlash > 0 ? 0 : 10;
    ctx.fillStyle = col;
    const sides = this.type==='fast' ? 7 : (this.type==='normal' ? 8 : 10);
    drawRegularPolygon(ctx, sx, sy, this.size*pulse, sides, this.phase + Date.now()/1200);
    ctx.fill();
    ctx.strokeStyle = this.hitFlash > 0 ? '#ffffff' : 'rgba(180,20,35,0.8)';
    ctx.lineWidth = this.type==='elite' || this.isBoss ? 2 : 1;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff2020';
    ctx.shadowColor = '#ff2020'; ctx.shadowBlur = 8;
    const eyeOffset = this.size * 0.32;
    ctx.beginPath(); ctx.arc(sx-eyeOffset, sy-this.size*0.18, Math.max(2,this.size*0.13), 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+eyeOffset, sy-this.size*0.18, Math.max(2,this.size*0.13), 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
const enemyPool = new Pool(()=>new Enemy());

class Orbital {
  constructor() { this.angle=0; this.radius=80; this.speed=2.5; this.damage=15; this.size=10; }
  update(dt) { this.angle+=this.speed*dt; }
  getPos(playerX, playerY) {
    return { x:playerX+Math.cos(this.angle)*this.radius, y:playerY+Math.sin(this.angle)*this.radius };
  }
  draw(ctx, cam, px, py) {
    const p = this.getPos(px, py);
    const sp = worldToScreen(p.x, p.y, cam);
    const sx=sp.x, sy=sp.y;
    ctx.fillStyle='#44ddcc'; ctx.shadowColor='#44ddcc'; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(sx,sy,this.size,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // Orbit line
    ctx.strokeStyle='rgba(68,221,204,0.12)'; ctx.lineWidth=1;
    const cp = worldToScreen(px, py, cam);
    ctx.save();
    ctx.translate(cp.x, cp.y);
    ctx.scale(1, VIEW_Y_SCALE);
    ctx.beginPath(); ctx.arc(0,0,this.radius,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

class Turret {
  constructor() { this.alive=true; this.x=0; this.y=0; this.fireTimer=0; this.fireRate=0.8; this.damage=15; this.life=30; this.range=250; }
  place(x,y) { this.alive=true; this.x=x; this.y=y; this.fireTimer=0; this.life=30; return this; }
  update(dt) {
    this.life-=dt; if(this.life<=0)this.alive=false; this.fireTimer+=dt;
  }
  canFire() { return this.fireTimer>=this.fireRate; }
  fire(targetX,targetY) { this.fireTimer=0; return true; }
  draw(ctx,cam) {
    const p = worldToScreen(this.x, this.y, cam);
    const sx=p.x, sy=p.y;
    const alpha = Math.min(1, this.life/3);
    ctx.globalAlpha = alpha;
    ctx.fillStyle='#888'; ctx.fillRect(sx-8,sy-8,16,16);
    ctx.fillStyle='#aaa'; ctx.beginPath(); ctx.arc(sx,sy,6,0,Math.PI*2); ctx.fill();
    // Range circle
    ctx.strokeStyle='rgba(136,136,136,0.2)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(sx,sy,this.range,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha=1;
  }
}

// Thrust particle
class ThrustParticle {
  constructor() { this.alive = true; this.x = 0; this.y = 0; this.life = 0; }
  init(x, y) { this.alive = true; this.x = x; this.y = y; this.life = 0.35 + Math.random() * 0.25; return this; }
  update(dt) { this.life -= dt; if (this.life <= 0) this.alive = false; this.y += (40 + Math.random() * 30) * dt; }
}
function emitThrust(px, py, angle, count) {
  for (let i = 0; i < count; i++) {
    const spread = randRange(-0.5, 0.5);
    const a = angle + Math.PI + spread;
    const dist = randRange(14, 22);
    const tx = px + Math.cos(a) * dist;
    const ty = py + Math.sin(a) * dist;
    // Find dead or create new
    let tp = player.thrustParticles.find(p => !p.alive);
    if (!tp) { tp = new ThrustParticle(); player.thrustParticles.push(tp); }
    tp.init(tx, ty);
    tp.vx = Math.cos(a) * randRange(15, 50);
    tp.vy = Math.sin(a) * randRange(15, 50);
    tp.size = randRange(1.5, 3.5);
  }
  // Limit pool
  if (player.thrustParticles.length > 60) {
    player.thrustParticles = player.thrustParticles.filter(p => p.alive).slice(-50);
  }
}

// ==================== WAVE MANAGER ====================
function spawnEnemy(type) {
  // Spawn at edge of screen (outside visible area, inside world)
  const margin = 100;
  const camR = { x:camera.x-margin, y:camera.y-margin, w:CANVAS_W+margin*2, h:CANVAS_H+margin*2 };
  let spawnX, spawnY;
  const side = randInt(0,3);
  switch(side) {
    case 0: spawnX=randRange(0,WORLD_W); spawnY=camR.y; break; // top
    case 1: spawnX=randRange(0,WORLD_W); spawnY=camR.y+camR.h; break; // bottom
    case 2: spawnX=camR.x; spawnY=randRange(0,WORLD_H); break; // left
    case 3: spawnX=camR.x+camR.w; spawnY=randRange(0,WORLD_H); break; // right
  }
  spawnX = clamp(spawnX, 20, WORLD_W-20);
  spawnY = clamp(spawnY, 20, WORLD_H-20);
  // Don't spawn too close to player
  if (dist({x:spawnX,y:spawnY}, player) < 250) {
    spawnX += randSign()*300;
    spawnY += randSign()*300;
    spawnX = clamp(spawnX, 20, WORLD_W-20);
    spawnY = clamp(spawnY, 20, WORLD_H-20);
  }
  return enemyPool.get().init(spawnX, spawnY, type);
}

function spawnWave() {
  const d = gameState.difficultyMult;
  const normalCount = Math.floor(5 + d*3 + gameState.time/10);
  const fastCount = Math.floor(2 + d*2 + gameState.time/20);
  const eliteCount = gameState.time > 30 ? Math.floor(d*0.5 + gameState.time/60) : 0;
  for(let i=0;i<normalCount;i++) spawnEnemy('normal');
  for(let i=0;i<fastCount;i++) spawnEnemy('fast');
  for(let i=0;i<eliteCount;i++) spawnEnemy('elite');
  gameState.wave++;
}

function getAvailableUpgrades() {
  const available = upgradeDefs.filter(u => {
    const count = player.upgrades.filter(pu=>pu.id===u.id).length;
    return count < u.maxStack;
  });
  // Shuffle and pick 3
  const shuffled = [...available].sort(()=>Math.random()-0.5);
  const picks = shuffled.slice(0,3);
  // Force rarity distribution: at least one rare+
  const hasGood = picks.some(p=>p.rarity!=='common');
  if (!hasGood && available.some(a=>a.rarity!=='common')) {
    const goodOnes = available.filter(a=>a.rarity!=='common');
    picks[randInt(0,2)] = goodOnes[randInt(0,goodOnes.length-1)];
  }
  return picks;
}

function showUpgradeScreen() {
  gameState.upgrading = true;
  gameState.paused = true;
  const screen = document.getElementById('upgrade-screen');
  const cardsDiv = document.getElementById('upgrade-cards');
  cardsDiv.innerHTML = '';
  const upgrades = getAvailableUpgrades();
  upgrades.forEach((u, i) => {
    const card = document.createElement('div');
    card.className = 'upgrade-card';
    card.innerHTML = `
      <div class="upgrade-icon">${u.icon}</div>
      <div class="upgrade-name">${u.name}</div>
      <div class="upgrade-desc">${u.desc}</div>
      <div class="upgrade-rarity rarity-${u.rarity}">${u.rarity.toUpperCase()}</div>
    `;
    card.addEventListener('click', () => {
      card.classList.add('selecting');
      [...cardsDiv.children].forEach(other => { if (other !== card) other.style.opacity = '0'; });
      setTimeout(() => selectUpgrade(u), 160);
    });
    cardsDiv.appendChild(card);
  });
  screen.classList.add('active');
  sfxLevelUp();
}

function selectUpgrade(upgrade) {
  upgrade.apply();
  player.upgrades.push(upgrade);
  document.getElementById('upgrade-screen').classList.remove('active');
  gameState.upgrading = false;
  gameState.paused = false;
}

// ==================== MAP / BACKGROUND ====================
const bgCanvas = document.createElement('canvas');
bgCanvas.width = WORLD_W; bgCanvas.height = WORLD_H;
const bgCtx = bgCanvas.getContext('2d');

// Pre-generate building silhouettes for draw order
const buildings = [];
const obstacles = [];
const OBSTACLE_SPRITE_COLS = 8;

function addObstacle(x, y, sprite, scale=1, radius=32) {
  obstacles.push({ x, y, sprite, scale, radius, rotation: randRange(-0.12, 0.12), anchorJitter: randRange(-0.35, 0.35) });
}

function canPlaceObstacle(x, y, radius, padding=28) {
  for (const o of obstacles) {
    const minDist = radius + o.radius * o.scale + padding;
    const dx = x - o.x;
    const dy = y - o.y;
    if (dx*dx + dy*dy < minDist*minDist) return false;
  }
  return true;
}

function tryAddObstacle(x, y, sprite, scale=1, radius=32, padding=28) {
  if (!canPlaceObstacle(x, y, radius * scale, padding)) return false;
  addObstacle(x, y, sprite, scale, radius);
  return true;
}

function generateObstacles() {
  obstacles.length = 0;
  const safe = { x: WORLD_W/2, y: WORLD_H/2, r: 380 };

  // Broken wall lines and barricade rows.
  for (let line=0; line<6; line++) {
    let x = randRange(260, WORLD_W-260);
    let y = randRange(260, WORLD_H-260);
    if (dist({x,y}, safe) < safe.r) { line--; continue; }
    const a = randRange(0, Math.PI * 2);
    const count = randInt(3, 5);
    const gap = randRange(88, 118);
    const sprite = Math.random() < 0.55 ? 2 : randInt(3, 7);
    for (let i=0; i<count; i++) {
      const ox = x + Math.cos(a) * (i - count/2) * gap + randRange(-5,5);
      const oy = y + Math.sin(a) * (i - count/2) * gap + randRange(-5,5);
      if (ox < 80 || ox > WORLD_W-80 || oy < 80 || oy > WORLD_H-80) continue;
      if (dist({x:ox,y:oy}, safe) < safe.r) continue;
      tryAddObstacle(ox, oy, sprite, randRange(0.78, 0.98), randRange(24, 34), 38);
    }
  }

  // Scattered dead trees, ruins, and rubble.
  let placed = 0, attempts = 0;
  while (placed < 46 && attempts < 500) {
    attempts++;
    const x = randRange(90, WORLD_W-90);
    const y = randRange(90, WORLD_H-90);
    if (dist({x,y}, safe) < safe.r) continue;
    const roll = Math.random();
    const sprite = roll < 0.08 ? randInt(0,1) : randInt(2,7);
    const scale = sprite <= 1 ? randRange(0.66,0.92) : randRange(0.62,0.86);
    const radius = sprite <= 1 ? randRange(22,30) : randRange(24,34);
    if (tryAddObstacle(x, y, sprite, scale, radius, 58)) placed++;
  }
  obstacles.sort((a,b)=>a.y-b.y);
}

function resolveObstacleCollision(obj, radius) {
  for (const o of obstacles) {
    const minDist = radius + o.radius * o.scale;
    const dx = obj.x - o.x;
    const dy = obj.y - o.y;
    const d2 = dx*dx + dy*dy;
    if (d2 <= 0 || d2 >= minDist*minDist) continue;
    const d = Math.sqrt(d2);
    const push = minDist - d;
    obj.x += dx / d * push;
    obj.y += dy / d * push;
  }
}

function drawObstacles(ctx, cam) {
  const ready = (obstacleSpriteReady || obstacleSpriteSheet.complete) && obstacleSpriteSheet.naturalWidth > 0;
  const frameW = ready ? obstacleSpriteSheet.naturalWidth / OBSTACLE_SPRITE_COLS : 1;
  const frameH = ready ? obstacleSpriteSheet.naturalHeight : 1;
  for (const o of obstacles) {
    const p = worldToScreen(o.x, o.y, cam);
    const sx = Math.round(p.x);
    const sy = Math.round(p.y + o.anchorJitter);
    const drawW = o.radius * o.scale * 1.95;
    const drawH = drawW * frameH / frameW * 0.82;
    if (sx < -drawW || sx > CANVAS_W + drawW || sy < -drawH || sy > CANVAS_H + drawH) continue;
    drawGroundShadow(sx, sy, drawW, drawH, 0.24);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(o.rotation);
    if (ready) {
      ctx.filter = 'brightness(0.72) saturate(0.72) contrast(0.9)';
      ctx.shadowColor = 'rgba(0,0,0,0.55)';
      ctx.shadowBlur = 5;
      ctx.drawImage(
        obstacleSpriteSheet,
        o.sprite * frameW, 0, frameW, frameH,
        -drawW/2, -drawH*0.82, drawW, drawH
      );
    } else {
      ctx.fillStyle = '#15151f';
      ctx.strokeStyle = '#333348';
      ctx.lineWidth = 2;
      ctx.fillRect(-drawW/2, -drawH/2, drawW, drawH);
      ctx.strokeRect(-drawW/2, -drawH/2, drawW, drawH);
    }
    ctx.restore();
  }
}

function generateBackground() {
  // Deep night ground base
  bgCtx.fillStyle = '#0a0a0f';
  bgCtx.fillRect(0, 0, WORLD_W, WORLD_H);

  // Crack lines on scorched earth
  bgCtx.strokeStyle = 'rgba(30,30,50,0.4)';
  bgCtx.lineWidth = 0.7;
  for (let i = 0; i < 300; i++) {
    const cx = randRange(20, WORLD_W - 20);
    const cy = randRange(20, WORLD_H - 20);
    const len = randRange(20, 60);
    const ca = randRange(0, Math.PI * 2);
    bgCtx.beginPath();
    bgCtx.moveTo(cx, cy);
    let lx = cx, ly = cy;
    for (let j = 0; j < 3; j++) {
      lx += Math.cos(ca + randRange(-0.6, 0.6)) * (len / 3);
      ly += Math.sin(ca + randRange(-0.6, 0.6)) * (len / 3);
      bgCtx.lineTo(lx, ly);
    }
    bgCtx.stroke();
  }

  // Distant fire glow spots (circular gradient)
  for (let i = 0; i < 40; i++) {
    const fx = randRange(100, WORLD_W - 100);
    const fy = randRange(100, WORLD_H - 100);
    const fr = randRange(60, 180);
    const alpha = randRange(0.04, 0.12);
    const gradient = bgCtx.createRadialGradient(fx, fy, 0, fx, fy, fr);
    const hue = Math.random() < 0.5 ? '255,100,30' : '255,140,20';
    gradient.addColorStop(0, `rgba(${hue},${alpha * 1.5})`);
    gradient.addColorStop(0.5, `rgba(${hue},${alpha * 0.5})`);
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    bgCtx.fillStyle = gradient;
    bgCtx.beginPath(); bgCtx.arc(fx, fy, fr, 0, Math.PI * 2); bgCtx.fill();
  }

  // Abandoned building silhouettes
  buildings.length = 0;
  for (let i = 0; i < 50; i++) {
    const bx = randRange(80, WORLD_W - 80);
    const by = randRange(80, WORLD_H - 80);
    const bw = randRange(40, 100);
    const bh = randRange(60, 160);
    buildings.push({ x: bx, y: by, w: bw, h: bh, alpha: randRange(0.15, 0.35) });
  }
  // Sort buildings by y for depth ordering
  buildings.sort((a, b) => a.y - b.y);
  for (const b of buildings) {
    drawBuilding(bgCtx, b.x, b.y, b.w, b.h, b.alpha);
  }

  // Debris / small ruins scattered
  for (let i = 0; i < 80; i++) {
    const dx = randRange(30, WORLD_W - 30);
    const dy = randRange(30, WORLD_H - 30);
    bgCtx.fillStyle = `rgba(20,20,35,${randRange(0.2, 0.45)})`;
    bgCtx.fillRect(dx, dy, randRange(6, 18), randRange(4, 12));
  }

  // World border (hazard line)
  bgCtx.strokeStyle = 'rgba(255,60,30,0.5)'; bgCtx.lineWidth = 3;
  bgCtx.setLineDash([15, 8]);
  bgCtx.strokeRect(3, 3, WORLD_W - 6, WORLD_H - 6);
  bgCtx.setLineDash([]);
  generateObstacles();
}

function drawBuilding(ctx, x, y, w, h, alpha) {
  ctx.fillStyle = `rgba(8,8,16,${alpha})`;
  ctx.strokeStyle = `rgba(25,25,45,${alpha * 0.5})`;
  ctx.lineWidth = 1;
  // Main body
  ctx.fillRect(x, y, w, h);
  ctx.strokeRect(x, y, w, h);
  // Roof details
  const roofH = h * 0.15;
  ctx.fillStyle = `rgba(12,12,22,${alpha})`;
  ctx.fillRect(x - 6, y, w + 12, roofH);
  // Window holes (dimly lit)
  ctx.fillStyle = `rgba(255,140,40,${alpha * 0.25})`;
  const winW = 8, winH = 10, gapX = 18, gapY = 22;
  for (let wy = y + roofH + 12; wy < y + h - 16; wy += gapY) {
    for (let wx = x + 10; wx < x + w - 14; wx += gapX) {
      if (Math.random() < 0.6) {
        ctx.fillRect(wx, wy, winW, winH);
      }
    }
  }
  // Antenna / broken structures on roof
  ctx.strokeStyle = `rgba(18,18,30,${alpha})`; ctx.lineWidth = 1.5;
  if (Math.random() < 0.4) {
    ctx.beginPath(); ctx.moveTo(x + w * 0.3, y); ctx.lineTo(x + w * 0.3, y - randRange(12, 28)); ctx.stroke();
  }
  if (Math.random() < 0.35) {
    ctx.beginPath(); ctx.moveTo(x + w * 0.7, y); ctx.lineTo(x + w * 0.7, y - randRange(8, 20)); ctx.stroke();
  }
}

// ==================== COLLISION DETECTION ====================
function bulletEnemyCollision(bullet, enemy) {
  const d = dist(bullet, enemy);
  return d < (bullet.size + enemy.size);
}

function playerEnemyCollision(enemy) {
  const d = dist(player, enemy);
  return d < (player.size + enemy.size);
}
