// ==================== MAIN GAME LOOP ====================
let lastTime = 0;

function update(dt) {
  if (!gameState.running || gameState.paused) return;

  // Clamp dt
  const dtc = Math.min(dt, 0.1);
  gameState.time += dtc;

  // Win condition
  if (gameState.time >= GAME_DURATION) {
    endGame(true);
    return;
  }

  // Difficulty scaling
  gameState.difficultyMult = 1 + gameState.time/60;

  // --- Player Movement ---
  let mx=0, my=0;
  if (keys.w || keys.arrowup) my-=1;
  if (keys.s || keys.arrowdown) my+=1;
  if (keys.a || keys.arrowleft) mx-=1;
  if (keys.d || keys.arrowright) mx+=1;
  if (mx!==0||my!==0) {
    const mag = Math.hypot(mx,my);
    mx/=mag; my/=mag;
  }
  player.vx = mx*player.moveSpeed;
  player.vy = my*player.moveSpeed;
  player.x += player.vx*dtc;
  player.y += player.vy*dtc;
  player.x = clamp(player.x, player.size, WORLD_W-player.size);
  player.y = clamp(player.y, player.size, WORLD_H-player.size);
  resolveObstacleCollision(player, player.size + 4);
  player.x = clamp(player.x, player.size, WORLD_W-player.size);
  player.y = clamp(player.y, player.size, WORLD_H-player.size);

  // HP Regen
  player.invulnTimer = Math.max(0, player.invulnTimer-dtc);
  player.hp = Math.min(player.maxHp, player.hp + player.hpRegen*dtc);

  // --- Auto Aim ---
  const aliveEnemies = enemyPool.getAlive();
  let nearestEnemy = null, nearestDist = Infinity;
  for (const enemy of aliveEnemies) {
    const d = dist(player, enemy);
    if (d < nearestDist) { nearestDist=d; nearestEnemy=enemy; }
  }

  // --- Firing ---
  player.fireTimer += dtc;
  const effectiveFireRate = player.charType===0 ? 0.55 : (1/player.fireRate);
  if (player.fireTimer >= effectiveFireRate && nearestEnemy) {
    player.fireTimer = 0;
    fireWeapon(nearestEnemy);
  }

  // --- Engineer Turrets ---
  if (player.charType===2) {
    player.turretTimer += dtc;
    if (player.turretTimer >= 5 && nearestEnemy) {
      player.turretTimer = 0;
      const t = new Turret();
      t.place(player.x+randRange(-40,40), player.y+randRange(-40,40));
      t.damage = 15*player.damageMult;
      t.fireRate = 0.8/player.fireRate*3;
      player.turrets.push(t);
      if (player.turrets.length > 5) player.turrets.shift();
    }
  }

  // --- Update Turrets ---
  for (const t of player.turrets) {
    t.update(dtc);
    if (t.canFire() && nearestEnemy) {
      const ta = angle(t, nearestEnemy);
      bulletPool.get().init(t.x,t.y,ta,400,t.damage,'#aaa',3,0,0,0,'none');
      t.fire();
    }
  }

  // --- Rebuild Spatial Grid ---
  enemyGrid.clear();
  for (const enemy of aliveEnemies) {
    if (enemy.alive) enemyGrid.insert(enemy);
  }

  // --- Update Bullets ---
  for (const bullet of bulletPool.getAlive()) {
    bullet.update(dtc);
    if (!bullet.alive) continue;

    // Use spatial grid for collision
    const nearbyEnemies = enemyGrid.query(bullet.x, bullet.y, bullet.size + 40);
    let hit = false;
    for (const enemy of nearbyEnemies) {
      if (!enemy.alive) continue;
      if (bulletEnemyCollision(bullet, enemy)) {
        // Damage calc
        let dmg = bullet.damage * player.damageMult;
        const isCrit = Math.random() < player.critChance;
        if (isCrit) dmg *= player.critMult;
        // Boss bonus
        if ((enemy.isBoss||enemy.type==='elite') && player.bossDmgBonus) dmg*=1+player.bossDmgBonus;

        const killed = enemy.takeDamage(dmg, bullet, player.x, player.y);
        gameState.totalDamageDealt += dmg;

        if (isCrit) {
          floatTextPool.get().init(enemy.x, enemy.y-10, Math.floor(dmg)+'!', '#ff4400');
        } else if (killed) {
          floatTextPool.get().init(enemy.x, enemy.y-10, Math.floor(dmg), '#ffffff');
        }
        applyElementArea(bullet, enemy, dmg);

        if (killed) {
          onEnemyKilled(enemy);
          if (bullet.aoeRadius>0) {
            const aoeTargets = enemyGrid.query(enemy.x, enemy.y, bullet.aoeRadius);
            for (const e2 of aoeTargets) {
              if (e2!==enemy&&e2.alive&&dist(enemy,e2)<bullet.aoeRadius) {
                e2.takeDamage(dmg*0.6, null, player.x, player.y);
              }
            }
            spawnExplosion(enemy.x, enemy.y, 15, '#ff8800', 5, 0.4);
          }
        } else {
          spawnImpact(bullet.x, bullet.y, bullet.kind === 'energy' ? '#00d4ff' : '#ff6600');
        }

        // Pierce / bounce
        if (bullet.pierce > 0) {
          bullet.pierce--;
          // Continue through
        } else if (bullet.bounces > 0) {
          bullet.bounces--;
          // Find nearby enemy to bounce to (use grid)
          let bounceTarget = null, bounceDist = 200;
          const bounceCandidates = enemyGrid.query(enemy.x, enemy.y, bounceDist);
          for (const e2 of bounceCandidates) {
            if (e2!==enemy&&e2.alive&&!bullet.bounceTargets.includes(e2)) {
              const d = dist(enemy, e2);
              if (d < bounceDist) { bounceDist=d; bounceTarget=e2; }
            }
          }
          if (bounceTarget) {
            bullet.bounceTargets.push(enemy);
            const ba = angle(enemy, bounceTarget);
            bullet.x = enemy.x; bullet.y = enemy.y;
            bullet.vx = Math.cos(ba)*bullet.speed*0.9;
            bullet.vy = Math.sin(ba)*bullet.speed*0.9;
          } else { bullet.alive = false; }
        } else {
          bullet.alive = false;
        }
        hit = true;
        break;
      }
    }
  }

  // --- Update Enemies ---
  for (const enemy of aliveEnemies) {
    enemy.update(dtc, player.x, player.y);
    if (!enemy.alive) continue;
    resolveObstacleCollision(enemy, enemy.size * 0.78);
    enemy.x = clamp(enemy.x, enemy.size, WORLD_W-enemy.size);
    enemy.y = clamp(enemy.y, enemy.size, WORLD_H-enemy.size);
    // Collision with player
    if (playerEnemyCollision(enemy)) {
      const dmg = enemy.isBoss? 30 : (enemy.type==='elite'? 20 : 10);
      const dead = playerTakeDamage(dmg);
      // Push enemy back
      const pa = angle(player, enemy);
      enemy.knockbackX += Math.cos(pa)*200;
      enemy.knockbackY += Math.sin(pa)*200;
      if (dead) { endGame(false); return; }
    }
  }

  updateBossAttacks(dtc);

  // --- Update Orbitals ---
  for (const orb of player.orbitals) {
    orb.update(dtc);
    const op = orb.getPos(player.x, player.y);
    const nearbyOrb = enemyGrid.query(op.x, op.y, orb.size + 40);
    for (const enemy of nearbyOrb) {
      if (!enemy.alive) continue;
      if (dist(op, enemy) < orb.size+enemy.size) {
        const killed = enemy.takeDamage(orb.damage*player.damageMult, null, player.x, player.y);
        if (killed) onEnemyKilled(enemy);
      }
    }
  }

  // --- Aura ---
  if (player.auraRadius > 0) {
    const nearbyAura = enemyGrid.query(player.x, player.y, player.auraRadius);
    for (const enemy of nearbyAura) {
      if (!enemy.alive) continue;
      if (dist(player, enemy) < player.auraRadius) {
        enemy.takeDamage(player.auraDmg*dtc, null, player.x, player.y);
      }
    }
  }

  // --- Update Pickups ---
  for (const pickup of pickupPool.getAlive()) {
    pickup.update(dtc);
    // Magnet
    if (pickup.type==='xp' && dist(player, pickup) < player.magnetRange) {
      const a = angle(pickup, player);
      pickup.x += Math.cos(a)*300*dtc;
      pickup.y += Math.sin(a)*300*dtc;
    }
    // Pickup collision
    if (dist(player, pickup) < player.pickupRadius+10) {
      if (pickup.type==='xp') {
        player.xp += pickup.value;
        gameState.totalXpEarned += pickup.value;
        floatTextPool.get().init(pickup.x, pickup.y, '+'+pickup.value+'XP', '#44ff44');
        sfxPickup();
        while (player.xp >= player.xpToNext) {
          player.xp -= player.xpToNext;
          player.level++;
          player.xpToNext = Math.floor(player.xpToNext * 1.35);
          gameState.levelFlash = 0.45;
          showUpgradeScreen();
          if (gameState.upgrading) break; // Don't level multiple times at once
        }
      } else if (pickup.type==='heal') {
        player.hp = Math.min(player.maxHp, player.hp+30);
        floatTextPool.get().init(pickup.x, pickup.y, '+30HP', '#ff4444');
        sfxPickup();
      } else if (pickup.type==='crate') {
        player.hp = Math.min(player.maxHp, player.hp+50);
        // Random temp buff
        const buffType = randInt(0,2);
        if (buffType===0) player.damageMult+=0.3; // damage buff
        if (buffType===1) player.fireRate*=1.3; // fire rate
        floatTextPool.get().init(pickup.x, pickup.y, 'BUFF!', '#daa520');
        sfxPickup();
      }
      pickup.alive = false;
    }
  }

  // --- Update Particles ---
  for (const p of particlePool.getAlive()) p.update(dtc);
  for (const t of floatTextPool.getAlive()) t.update(dtc);
  updateElementFx(dtc);
  gameState.damageVignette = Math.max(0, gameState.damageVignette - dtc);
  gameState.levelFlash = Math.max(0, gameState.levelFlash - dtc);
  gameState.sparkTimer -= dtc;
  if (gameState.sparkTimer <= 0) {
    gameState.sparkTimer = 3;
    spawnGroundSpark();
  }

  // --- Wave Spawning ---
  gameState.waveTimer += dtc;
  const waveInterval = Math.max(3, 15 - gameState.time/40);
  if (gameState.waveTimer >= waveInterval) {
    gameState.waveTimer = 0;
    spawnWave();
  }

  // --- Boss Timer ---
  gameState.bossTimer += dtc;
  if (gameState.bossTimer >= BOSS_SPAWN_INTERVAL && !gameState.bossActive) {
    gameState.bossTimer = 0;
    gameState.bossActive = true;
    gameState.bossRef = spawnEnemy('boss');
    sfxBossSpawn();
    floatTextPool.get().init(gameState.bossRef.x, gameState.bossRef.y-20, 'BOSS!', '#ff0000');
  }

  // --- Supply Crate ---
  gameState.supplyTimer -= dtc;
  if (gameState.supplyTimer <= 0) {
    gameState.supplyTimer = randRange(20, 40);
    const cx = player.x + randSign()*randRange(200,400);
    const cy = player.y + randSign()*randRange(200,400);
    pickupPool.get().init(clamp(cx,30,WORLD_W-30), clamp(cy,30,WORLD_H-30), 'crate');
  }

  // --- Camera ---
  updateCamera(player.x, player.y, dtc);
}

function fireWeapon(target) {
  const a = player.gunAngle;
  const dmg = 10;
  const spd = player.bulletSpeed;
  const element = player.element;
  let bulletColor = '#ffcc33';
  if (element==='fire') bulletColor='#ff6622';
  else if (element==='ice') bulletColor='#44ccff';
  else if (element==='lightning') bulletColor='#ffdd22';

  // Gun flash
  player.gunFlashTimer = 0.06;

  // Bullet spawn from gun barrel tip
  const barrelTipDist = 36;
  const spawnX = player.x + Math.cos(a) * barrelTipDist;
  const spawnY = player.y + Math.sin(a) * barrelTipDist;

  if (player.charType === 0) {
    // Miner: Shotgun - 5 bullets in cone
    const spread = 0.25;
    for (let i=-2; i<=2; i++) {
      const ba = a + i*spread;
      const b = bulletPool.get().init(spawnX,spawnY,ba,spd*(0.8+Math.random()*0.4),dmg*0.8,'#ff4400',
        Math.max(4,player.bulletSize),player.pierce,player.bounces,player.aoeRadius,element);
      b.kind = 'shotgun';
    }
  } else if (player.charType === 1) {
    // Mecha: Rapid single bullets
    const b = bulletPool.get().init(spawnX,spawnY,a+randRange(-0.04,0.04),spd,dmg*0.6,'#ffaa00',
      player.bulletSize,player.pierce,player.bounces,player.aoeRadius,element);
    b.kind = element === 'none' ? 'machinegun' : 'energy';
  } else {
    // Engineer: Normal shots + turrets handle rest
    const b = bulletPool.get().init(spawnX,spawnY,a,spd,dmg,'#00d4ff',
      Math.max(3,player.bulletSize),player.pierce,player.bounces,player.aoeRadius,element);
    b.kind = 'energy';
  }

  // Split shot
  if (player.splitCount>0 && player.charType!==0) {
    for (let i=0; i<player.splitCount; i++) {
      const sa = a + randSign()*randRange(0.3,0.6);
      const b = bulletPool.get().init(spawnX,spawnY,sa,spd*0.85,dmg*0.5,'#ffaa00',
        player.bulletSize,player.pierce,player.bounces,player.aoeRadius,element);
      b.kind = 'machinegun';
    }
  }

  sfxShoot();
}

function onEnemyKilled(enemy) {
  gameState.kills++;
  if (enemy.isBoss) {
    gameState.bossActive = false;
    gameState.bossRef = null;
    spawnExplosion(enemy.x, enemy.y, 44, '#8f1aff', 8, 0.6);
    particlePool.get().init(enemy.x, enemy.y, 0, 0, 0.32, '#ffffff', 42, 'shockwave');
    shakeCamera(6, 0.16);
    sfxEliteKill();
    // Drop lots of XP
    for (let i=0;i<20;i++) pickupPool.get().init(enemy.x+randRange(-30,30),enemy.y+randRange(-30,30),'xp',15);
    pickupPool.get().init(enemy.x, enemy.y, 'heal');
  } else {
    spawnExplosion(enemy.x, enemy.y, enemy.type==='elite' ? 18 : 10, enemy.type==='elite' ? '#8f1aff' : '#ff3322', enemy.type==='elite' ? 5 : 3, 0.28);
    particlePool.get().init(enemy.x, enemy.y, 0, 0, 0.22, '#ffffff', enemy.type==='elite' ? 30 : 20, 'shockwave');
    if (enemy.type==='elite') shakeCamera(3, 0.08);
    sfxKill();
    // XP drop
    pickupPool.get().init(enemy.x+randRange(-10,10), enemy.y+randRange(-10,10), 'xp', enemy.xpValue);
    // Heal drop chance
    if (enemy.type==='elite') {
      sfxEliteKill();
      if (Math.random()<0.3) pickupPool.get().init(enemy.x, enemy.y, 'heal');
      for (let i=0;i<3;i++) pickupPool.get().init(enemy.x+randRange(-20,20),enemy.y+randRange(-20,20),'xp',20);
    }
  }
  // Lifesteal
  if (player.lifesteal) player.hp = Math.min(player.maxHp, player.hp+5);
}

// ==================== PLAYER MECHA DRAWING ====================
const MECHA_SPRITE_COLS = 8;
const MECHA_SPRITE_ROWS = 3;
const MECHA_ROW_BY_CHAR = [1, 2, 0]; // shotgun/heavy, rapid/scout, engineer/assault

function angleDelta(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return Math.abs(d);
}

function directionFrameFromAngle(a) {
  const dirs = [
    Math.PI / 2, Math.PI / 4, 0, -Math.PI / 4,
    -Math.PI / 2, -Math.PI * 3 / 4, Math.PI, Math.PI * 3 / 4
  ];
  let best = 0, bestDiff = Infinity;
  for (let i=0; i<dirs.length; i++) {
    const diff = angleDelta(a, dirs[i]);
    if (diff < bestDiff) { bestDiff = diff; best = i; }
  }
  return best;
}

function drawMechaMuzzleFlash(px, py, angle) {
  if (player.gunFlashTimer <= 0) return;
  const alpha = clamp(player.gunFlashTimer / 0.06, 0, 1);
  const fx = px + Math.cos(angle) * 32;
  const fy = py + Math.sin(angle) * 32;
  ctx.save();
  ctx.translate(fx, fy);
  ctx.rotate(angle);
  ctx.globalAlpha = alpha;
  ctx.shadowColor = '#ffdd99';
  ctx.shadowBlur = 18;
  ctx.fillStyle = 'rgba(255,245,220,0.95)';
  ctx.beginPath();
  for (let i=0; i<12; i++) {
    const r = i % 2 === 0 ? 16 : 4;
    const a = i * Math.PI * 2 / 12;
    const x = Math.cos(a) * r;
    const y = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawMechaSpriteFrame(px, py) {
  const frameW = mechaSpriteSheet.naturalWidth / MECHA_SPRITE_COLS;
  const frameH = mechaSpriteSheet.naturalHeight / MECHA_SPRITE_ROWS;
  const row = MECHA_ROW_BY_CHAR[player.charType] || 0;
  const col = directionFrameFromAngle(player.gunAngle);
  const drawW = player.charType === 0 ? 82 : (player.charType === 1 ? 68 : 74);
  const drawH = drawW * frameH / frameW;

  drawGroundShadow(px, py, drawW, drawH, 0.3);
  ctx.save();
  ctx.shadowColor = '#00d4ff';
  ctx.shadowBlur = 9;
  ctx.filter = 'brightness(0.92) saturate(0.9) contrast(0.98)';
  ctx.drawImage(
    mechaSpriteSheet,
    col * frameW, row * frameH, frameW, frameH,
    px - drawW / 2, py - drawH * 0.78, drawW, drawH
  );
  ctx.restore();
  drawMechaMuzzleFlash(px, py, player.gunAngle);
}

function drawPlayerMecha() {
  const pp = worldToScreen(player.x, player.y, camera);
  const px = pp.x;
  const py = pp.y;
  const ga = player.gunAngle;

  ctx.save();
  // Invuln flash
  if (player.invulnTimer > 0 && Math.floor(player.invulnTimer * 20) % 2 === 0) {
    ctx.globalAlpha = 0.35;
  }

  // --- Cyan ambient light around mecha ---
  const ambient = ctx.createRadialGradient(px, py, 0, px, py, 80);
  ambient.addColorStop(0, 'rgba(0,212,255,0.15)');
  ambient.addColorStop(0.45, 'rgba(0,212,255,0.06)');
  ambient.addColorStop(1, 'rgba(0,212,255,0)');
  ctx.fillStyle = ambient;
  ctx.beginPath(); ctx.arc(px, py, 80, 0, Math.PI * 2); ctx.fill();

  // --- Thruster flames (behind mecha) ---
  for (const tp of player.thrustParticles) {
    if (!tp.alive) continue;
    const tpScreen = worldToScreen(tp.x, tp.y, camera);
    const ty = tpScreen.y;
    const tx = tpScreen.x;
    if (tx < -20 || tx > CANVAS_W + 20 || ty < -20 || ty > CANVAS_H + 20) continue;
    const alpha = Math.max(0, tp.life / 0.6);
    ctx.globalAlpha = alpha * 0.7;
    const grad = ctx.createRadialGradient(tx, ty, 0, tx, ty, tp.size);
    grad.addColorStop(0, 'rgba(100,200,255,0.8)');
    grad.addColorStop(0.5, 'rgba(30,120,255,0.4)');
    grad.addColorStop(1, 'rgba(0,50,180,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(tx, ty, tp.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = player.invulnTimer > 0 && Math.floor(player.invulnTimer * 20) % 2 === 0 ? 0.35 : 1;

  if ((mechaSpriteReady || mechaSpriteSheet.complete) && mechaSpriteSheet.naturalWidth > 0) {
    drawMechaSpriteFrame(px, py);
    ctx.restore();
    return;
  }

  // --- Leg thrusters (bottom) ---
  const legSpread = 9;
  const legY = py + 13;
  for (let side = -1; side <= 1; side += 2) {
    const lx = px + side * legSpread;
    // Thruster housing
    ctx.fillStyle = '#2a2a38';
    ctx.beginPath();
    ctx.ellipse(lx, legY, 6, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#3d3d50'; ctx.lineWidth = 1; ctx.stroke();
    // Inner glow
    const grad = ctx.createRadialGradient(lx, legY, 0, lx, legY, 4);
    grad.addColorStop(0, 'rgba(80,200,255,0.7)');
    grad.addColorStop(1, 'rgba(0,100,200,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(lx, legY, 3.5, 0, Math.PI * 2); ctx.fill();
  }

  // --- Main body (hexagonal) ---
  const bodySize = 13;
  const hexPoints = [];
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + (Math.PI * 2 / 6) * i;
    hexPoints.push({ x: px + Math.cos(a) * bodySize, y: py + Math.sin(a) * bodySize * 1.05 });
  }
  // Body fill
  ctx.fillStyle = '#2a2a3a';
  ctx.beginPath();
  ctx.moveTo(hexPoints[0].x, hexPoints[0].y);
  for (let i = 1; i < 6; i++) ctx.lineTo(hexPoints[i].x, hexPoints[i].y);
  ctx.closePath();
  ctx.fill();
  // Body energy edge glow
  ctx.shadowColor = '#00d4ff'; ctx.shadowBlur = 12;
  ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 2;
  ctx.stroke();
  ctx.shadowBlur = 0;
  // Body inner panel lines
  ctx.strokeStyle = 'rgba(60,60,80,0.5)'; ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(px - 5, py - 4); ctx.lineTo(px + 5, py - 4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px, py - 6); ctx.lineTo(px, py + 3); ctx.stroke();

  // --- Core glow (pulsing) ---
  const corePulse = 1 + Math.sin(player.corePhase) * 0.25;
  const coreRadius = 4 * corePulse;
  const coreGrad = ctx.createRadialGradient(px, py, 0, px, py, coreRadius * 1.8);
  coreGrad.addColorStop(0, 'rgba(0,255,204,0.9)');
  coreGrad.addColorStop(0.4, 'rgba(0,210,180,0.5)');
  coreGrad.addColorStop(1, 'rgba(0,150,130,0)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath(); ctx.arc(px, py, coreRadius * 1.8, 0, Math.PI * 2); ctx.fill();
  // Core center dot
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(px, py, coreRadius * 0.45, 0, Math.PI * 2); ctx.fill();

  // --- Shoulder armor ---
  for (let side = -1; side <= 1; side += 2) {
    const sx = px + side * (bodySize + 2);
    const sy = py - 4;
    // Trapezoid shoulder plate
    ctx.fillStyle = '#313148';
    ctx.beginPath();
    ctx.moveTo(sx - side * 4, sy - 5);
    ctx.lineTo(sx + side * 7, sy - 8);
    ctx.lineTo(sx + side * 7, sy + 5);
    ctx.lineTo(sx - side * 4, sy + 8);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#4a4a68'; ctx.lineWidth = 1; ctx.stroke();
    // Decorative lines
    ctx.strokeStyle = 'rgba(80,80,110,0.5)'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(sx - side * 2, sy - 3); ctx.lineTo(sx - side * 2, sy + 4); ctx.stroke();
  }

  // --- Left arm: shield / secondary plate ---
  const leftX = px - bodySize - 8;
  const leftY = py + 1;
  ctx.fillStyle = '#353548';
  ctx.fillRect(leftX - 3, leftY - 5, 7, 13);
  ctx.strokeStyle = '#4a4a68'; ctx.lineWidth = 1; ctx.strokeRect(leftX - 3, leftY - 5, 7, 13);
  // Shield glow edge
  ctx.strokeStyle = 'rgba(0,180,240,0.4)'; ctx.lineWidth = 1.5;
  ctx.strokeRect(leftX - 3, leftY - 5, 7, 13);

  // --- Right arm: rotating gun barrel ---
  const gunBaseX = px + bodySize + 4;
  const gunBaseY = py + 1;
  // Gun base (shoulder mount)
  ctx.fillStyle = '#3a3a4e';
  ctx.fillRect(gunBaseX - 2, gunBaseY - 4, 6, 10);
  ctx.strokeStyle = '#555570'; ctx.lineWidth = 1; ctx.strokeRect(gunBaseX - 2, gunBaseY - 4, 6, 10);

  // Rotating barrel
  const barrelLen = 18;
  const barrelW = 3.5;
  const bx = gunBaseX + 3;
  const by = gunBaseY;
  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(ga);
  // Barrel body
  ctx.fillStyle = '#404058';
  ctx.fillRect(0, -barrelW, barrelLen, barrelW * 2);
  ctx.strokeStyle = '#606080'; ctx.lineWidth = 1;
  ctx.strokeRect(0, -barrelW, barrelLen, barrelW * 2);
  // Barrel tip glow
  const flashAlpha = player.gunFlashTimer > 0 ? 0.9 : 0.35;
  const tipGrad = ctx.createRadialGradient(barrelLen, 0, 0, barrelLen, 0, 5);
  tipGrad.addColorStop(0, `rgba(255,160,30,${flashAlpha})`);
  tipGrad.addColorStop(0.5, `rgba(255,100,0,${flashAlpha * 0.6})`);
  tipGrad.addColorStop(1, 'rgba(255,60,0,0)');
  ctx.fillStyle = tipGrad;
  ctx.beginPath(); ctx.arc(barrelLen, 0, 5, 0, Math.PI * 2); ctx.fill();
  if (player.gunFlashTimer > 0) {
    const starA = player.gunFlashTimer / 0.06;
    ctx.globalAlpha = clamp(starA, 0, 1);
    ctx.shadowColor = '#ffdd99'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,245,220,0.95)';
    ctx.beginPath();
    for (let i=0; i<12; i++) {
      const r = i % 2 === 0 ? 15 : 4;
      const aa = i * Math.PI * 2 / 12;
      const x = barrelLen + Math.cos(aa) * r;
      const y = Math.sin(aa) * r;
      if (i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // Barrel highlight line
  ctx.strokeStyle = 'rgba(100,100,140,0.5)'; ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(2, -1); ctx.lineTo(barrelLen - 3, -1); ctx.stroke();
  ctx.restore();

  // --- Head / sensor array (top of body) ---
  const headY = py - bodySize - 3;
  ctx.fillStyle = '#2a2a3c';
  ctx.fillRect(px - 5, headY - 3, 10, 7);
  ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 1; ctx.strokeRect(px - 5, headY - 3, 10, 7);
  // Sensor eye
  ctx.fillStyle = '#ff4444';
  ctx.beginPath(); ctx.arc(px, headY, 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(px, headY, 0.8, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// ==================== SCANLINE OVERLAY ====================
function drawScanlines() {
  ctx.fillStyle = 'rgba(0,0,0,0.04)';
  for (let y = 0; y < CANVAS_H; y += 3) {
    ctx.fillRect(0, y, CANVAS_W, 1);
  }
  // Occasional brighter scanline
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  for (let y = 0; y < CANVAS_H; y += 18) {
    ctx.fillRect(0, y, CANVAS_W, 1);
  }
}

function drawDynamicWastelandLights() {
  if (currentMapType !== 'wasteland') return;
  ctx.save();
  const spots = 5;
  for (let i=0; i<spots; i++) {
    const seed = i * 997;
    const wp = {
      x: (Math.sin(seed) * 0.5 + 0.5) * WORLD_W,
      y: (Math.cos(seed * 1.7) * 0.5 + 0.5) * WORLD_H
    };
    const sp = worldToScreen(wp.x, wp.y, camera);
    const x = sp.x, y = sp.y;
    if (x < -220 || x > CANVAS_W + 220 || y < -220 || y > CANVAS_H + 220) continue;
    const flicker = 0.55 + Math.sin(gameState.time*1.4 + i*2.1)*0.2 + Math.random()*0.04;
    const r = 90 + i*18;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(255,90,22,${0.11*flicker})`);
    grad.addColorStop(0.45, `rgba(255,80,20,${0.045*flicker})`);
    grad.addColorStop(1, 'rgba(255,80,20,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawSelectedMapBackground() {
  const img = mapImages[currentMapType];
  if (!img || !img.complete || img.naturalWidth <= 0) {
    const renderX = Math.round(camera.x);
    const renderY = Math.round(camera.y);
    const worldLeft = clamp(renderX, 0, WORLD_W);
    const worldTop = clamp(renderY - VIEW_Y_OFFSET / VIEW_Y_SCALE, 0, WORLD_H);
    const worldRight = clamp(renderX + CANVAS_W, 0, WORLD_W);
    const worldBottom = clamp(renderY + (CANVAS_H - VIEW_Y_OFFSET) / VIEW_Y_SCALE, 0, WORLD_H);
    const dx = Math.round(worldLeft - renderX);
    const dy = Math.round((worldTop - renderY) * VIEW_Y_SCALE + VIEW_Y_OFFSET);
    const dw = Math.ceil(worldRight - worldLeft);
    const dh = Math.ceil((worldBottom - worldTop) * VIEW_Y_SCALE);
    ctx.drawImage(bgCanvas, worldLeft, worldTop, worldRight-worldLeft, worldBottom-worldTop, dx, dy, dw, dh);
    return;
  }
  const renderX = Math.round(camera.x);
  const renderY = Math.round(camera.y);
  const worldLeft = clamp(renderX, 0, WORLD_W);
  const worldTop = clamp(renderY - VIEW_Y_OFFSET / VIEW_Y_SCALE, 0, WORLD_H);
  const worldRight = clamp(renderX + CANVAS_W, 0, WORLD_W);
  const worldBottom = clamp(renderY + (CANVAS_H - VIEW_Y_OFFSET) / VIEW_Y_SCALE, 0, WORLD_H);
  const sx = worldLeft / WORLD_W * img.naturalWidth;
  const sy = worldTop / WORLD_H * img.naturalHeight;
  const sw = (worldRight - worldLeft) / WORLD_W * img.naturalWidth;
  const sh = (worldBottom - worldTop) / WORLD_H * img.naturalHeight;
  const dx = Math.round(worldLeft - renderX);
  const dy = Math.round((worldTop - renderY) * VIEW_Y_SCALE + VIEW_Y_OFFSET);
  const dw = Math.ceil(worldRight - worldLeft);
  const dh = Math.ceil((worldBottom - worldTop) * VIEW_Y_SCALE);
  ctx.save();
  ctx.filter = currentMapType === 'snow'
    ? 'blur(1px) brightness(0.72) saturate(0.62) contrast(0.82)'
    : (currentMapType === 'desert'
      ? 'blur(1px) brightness(0.68) saturate(0.58) contrast(0.84)'
      : 'blur(1.3px) brightness(0.56) saturate(0.52) contrast(0.78)');
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
  ctx.restore();
  ctx.fillStyle = currentMapType === 'snow' ? 'rgba(5,15,28,0.36)' : (currentMapType === 'desert' ? 'rgba(35,18,5,0.34)' : 'rgba(0,0,8,0.44)');
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  const vignette = ctx.createRadialGradient(CANVAS_W/2, CANVAS_H/2, CANVAS_W*0.12, CANVAS_W/2, CANVAS_H/2, CANVAS_W*0.7);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.28)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
}

function drawDamageVignette() {
  if (gameState.damageVignette <= 0) return;
  const a = gameState.damageVignette / 0.5;
  ctx.save();
  const grad = ctx.createRadialGradient(CANVAS_W/2, CANVAS_H/2, CANVAS_W*0.25, CANVAS_W/2, CANVAS_H/2, CANVAS_W*0.72);
  grad.addColorStop(0, 'rgba(80,0,0,0)');
  grad.addColorStop(0.7, `rgba(120,0,0,${0.12*a})`);
  grad.addColorStop(1, `rgba(255,0,0,${0.38*a})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
  ctx.restore();
}

function render() {
  // Clear
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // Background
  drawSelectedMapBackground();
  drawDynamicWastelandLights();

  // Draw world border (hazard zone)
  ctx.strokeStyle = 'rgba(255,50,20,0.35)'; ctx.lineWidth = 2;
  ctx.setLineDash([12, 6]);
  const borderTopLeft = worldToScreen(2, 2, camera);
  ctx.strokeRect(borderTopLeft.x, borderTopLeft.y, WORLD_W-4, (WORLD_H-4) * VIEW_Y_SCALE);
  ctx.setLineDash([]);

  // Draw solid wasteland obstacles
  drawObstacles(ctx, camera);

  // Draw pickups
  for (const p of pickupPool.getAlive()) p.draw(ctx, camera);

  // Draw turrets
  for (const t of player.turrets) { if (t.alive) t.draw(ctx, camera); }

  // Draw bullets
  for (const b of bulletPool.getAlive()) b.draw(ctx, camera);
  for (const fb of bossFireballPool.getAlive()) fb.draw(ctx, camera);

  // Draw enemies
  for (const e of enemyPool.getAlive()) e.draw(ctx, camera);

  // Draw elemental area attacks
  drawElementFx();
  drawBossBreaths();

  // Draw orbitals
  for (const orb of player.orbitals) orb.draw(ctx, camera, player.x, player.y);

  // Draw aura
  if (player.auraRadius > 0) {
    const sp=worldToScreen(player.x, player.y, camera);
    const sx=sp.x, sy=sp.y;
    const pulse = 1+Math.sin(Date.now()/500)*0.08;
    ctx.strokeStyle='rgba(255,180,40,0.3)'; ctx.lineWidth=2;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(1, VIEW_Y_SCALE);
    ctx.beginPath(); ctx.arc(0,0,player.auraRadius*pulse,0,Math.PI*2); ctx.stroke();
    ctx.restore();
    ctx.fillStyle='rgba(255,150,20,0.05)'; ctx.fill();
  }

  // Draw player mecha
  drawPlayerMecha();

  // Draw particles
  for (const p of particlePool.getAlive()) p.draw(ctx, camera);
  for (const t of floatTextPool.getAlive()) t.draw(ctx, camera);

  // Draw HUD
  drawHUD();
  drawMinimap();
  drawDamageVignette();

  // Upgrade glow
  if (gameState.upgrading) {
    ctx.fillStyle='rgba(255,215,0,0.06)';
    ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
  }

  // Scanline overlay
  drawScanlines();
}

// Need reference for aim indicator
let nearestEnemy = null;

function gameLoop(timestamp) {
  const dt = lastTime ? Math.min((timestamp - lastTime)/1000, 0.1) : 0.016;
  lastTime = timestamp;

  if (gameState.running) {
    // Find nearest enemy for aim indicator
    const aliveEnemies = enemyPool.getAlive();
    nearestEnemy = null; let nd = Infinity;
    for (const e of aliveEnemies) {
      const d = dist(player, e);
      if (d<nd) { nd=d; nearestEnemy=e; }
    }

    // Gun angle: auto-lock nearest enemy, same as the original shooting behavior.
    if (nearestEnemy) {
      player.targetGunAngle = angle(player, nearestEnemy);
    }
    // Smooth rotation
    let angleDiff = player.targetGunAngle - player.gunAngle;
    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
    player.gunAngle += angleDiff * Math.min(1, 18 * dt);

    // Core pulse
    player.corePhase += dt * 3.5;

    // Gun flash decay
    player.gunFlashTimer = Math.max(0, player.gunFlashTimer - dt);

    // Update thruster particles
    const isMoving = Math.abs(player.vx) > 5 || Math.abs(player.vy) > 5;
    if (isMoving) {
      emitThrust(player.x, player.y, angle({x:0,y:0}, {x:player.vx,y:player.vy}), 2);
    }
    for (const tp of player.thrustParticles) {
      if (tp.alive) tp.update(dt);
    }

    update(dt);
  }

  render();
  requestAnimationFrame(gameLoop);
}

function endGame(won) {
  gameState.running = false;
  gameState.paused = false;
  gameState.upgrading = false;
  stopBgm();
  document.getElementById('upgrade-screen').classList.remove('active');
  document.getElementById('boss-healthbar').style.display = 'none';
  const screen = document.getElementById('game-over-screen');
  screen.classList.add('active');
  document.getElementById('go-title').textContent = won ? '胜利！' : '游戏结束';
  document.getElementById('go-title').style.color = won ? '#ffd700' : '#ff4444';
  const stats = document.getElementById('go-stats');
  const mins = Math.floor(gameState.time/60), secs = Math.floor(gameState.time%60);
  stats.innerHTML = `
    存活时间：${mins}:${secs.toString().padStart(2,'0')}<br>
    击杀数：${gameState.kills}<br>
    等级：${player.level}<br>
    总伤害：${Math.floor(gameState.totalDamageDealt)}<br>
    总经验：${gameState.totalXpEarned}
  `;
  const builds = document.getElementById('go-builds');
  builds.innerHTML = '<strong>Build 总览：</strong><br>' +
    player.upgrades.map(u=>`${u.icon} ${u.name} [${u.rarity}]`).join('<br>');
}

function startGame(charType, mapType='wasteland') {
  initAudio();
  startBgm();
  currentMapType = MAP_DEFS[mapType] ? mapType : 'wasteland';
  generateObstacles();
  resetPlayer(charType);
  resetCameraToPlayer();
  resetGameState();
  document.getElementById('main-menu').classList.add('hidden');
  document.getElementById('game-over-screen').classList.remove('active');
  document.getElementById('upgrade-screen').classList.remove('active');
  document.getElementById('boss-healthbar').style.display = 'none';
  lastTime = 0;
  gameState.running = true;
}

// ==================== EVENT HANDLERS ====================
document.getElementById('btn-start').addEventListener('click', () => {
  const selected = document.querySelector('.char-card.selected');
  const selectedMap = document.querySelector('.map-card.selected');
  const charType = parseInt(selected.dataset.char);
  startGame(charType, selectedMap?.dataset?.map || 'wasteland');
});

document.querySelectorAll('.char-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.char-card').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
  });
});

document.querySelectorAll('.map-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.map-card').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    currentMapType = card.dataset.map || 'wasteland';
  });
});

document.getElementById('btn-restart').addEventListener('click', () => {
  const selected = document.querySelector('.char-card.selected');
  const selectedMap = document.querySelector('.map-card.selected');
  const charType = parseInt(selected?.dataset?.char || '0');
  startGame(charType, selectedMap?.dataset?.map || currentMapType);
});

document.getElementById('btn-menu').addEventListener('click', () => {
  gameState.running = false;
  stopBgm();
  document.getElementById('game-over-screen').classList.remove('active');
  document.getElementById('main-menu').classList.remove('hidden');
});

document.getElementById('btn-howto').addEventListener('click', () => {
  alert('操作说明：\nWASD / 方向键：移动\n鼠标：瞄准（自动锁定最近敌人）\n\n升级时点击卡片选择强化\n坚持10分钟或击败所有Boss即可胜利！\n\n角色：\n⛏️ 矿工 - 散弹枪近距离高伤害\n🤖 机甲 - 机枪快速连射\n🔧 工程师 - 自动炮塔部署');
});

// ==================== INIT ====================
generateBackground();
// Start loop even when menu is shown (for background animation)
gameState.running = false;
lastTime = performance.now();
requestAnimationFrame(gameLoop);

// Expose for debugging
window._game = { player, gameState, enemyPool, bulletPool, pickupPool, particlePool };
</script>
